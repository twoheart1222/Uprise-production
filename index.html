<style>
  /* --- 核心變數 --- */
  :root { 
    --bg-color: #050505;       
    --card-bg: rgba(20, 20, 20, 0.4); 
    --text-main: #FFFFFF;      
    --text-sub: #B0B0B0;       
    --brand-primary: #FF8C00;  
    --brand-light: #FFD700;    
    --brand-gradient: linear-gradient(135deg, #FFD700, #FF8C00);
    --silver-gradient: linear-gradient(to bottom, #ffffff 40%, #a0a0a0 100%);
    --font-display: 'Italiana', serif;
    --font-body: 'Noto Sans TC', sans-serif;
    --font-serif: 'Noto Serif TC', serif;
    --ease-out-expo: cubic-bezier(0.19, 1, 0.22, 1);
  }

  * { box-sizing: border-box; cursor: none; }

  input, textarea {
    -webkit-user-select: auto;
    user-select: auto;
    cursor: auto;
  }

  html { scroll-behavior: smooth; }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: #000; }
  ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--brand-primary); }

  ::selection { background: var(--brand-light); color: #000; }

  body {
    margin: 0; padding: 0;
    font-family: var(--font-body);
    background-color: var(--bg-color);
    color: var(--text-main);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  img {
    -webkit-user-drag: none;
    -khtml-user-drag: none;
    -moz-user-drag: none;
    -o-user-drag: none;
    pointer-events: none; 
  }

  /* =============================================
     Apple 風格轉場動畫
  ============================================= */
  .page-transition-curtain { display: none; }

  #main-wrapper {
    transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                filter 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    width: 100%;
    position: relative;
    z-index: 1;
  }
  body.loading-state #main-wrapper { opacity: 0; filter: blur(8px); }
  body.loaded-state  #main-wrapper { opacity: 1; filter: blur(0); }
  body.exiting       #main-wrapper { opacity: 0; filter: blur(8px); pointer-events: none; }

  /* =============================================
     載入器
  ============================================= */
  .loader {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; 
    z-index: 200000; 
    display: flex; justify-content: center; align-items: center;
    transition: opacity 0.4s ease, visibility 0.4s;
  }
  .loader.hidden { opacity: 0; visibility: hidden; }
  
  .loader-logo-img {
    width: auto; height: 70px; max-width: 200px;
    object-fit: contain;
    opacity: 0; transform: scale(0.9); filter: blur(8px);
    animation: loaderReveal 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes loaderReveal { 
    0%   { opacity: 0; transform: scale(0.9); filter: blur(8px); } 
    40%  { opacity: 1; transform: scale(1);   filter: blur(0); }
    80%  { opacity: 1; transform: scale(1);   filter: blur(0); }
    100% { opacity: 0; transform: scale(1.05); filter: blur(4px); } 
  }

  /* =============================================
     自訂游標
  ============================================= */
  .cursor {
    position: fixed; top: 0; left: 0; width: 12px; height: 12px;
    background: var(--brand-light);
    border-radius: 50%;
    pointer-events: none; 
    z-index: 2147483647; 
    transform: translate(-50%, -50%);
    box-shadow: 0 0 15px rgba(255, 215, 0, 0.9);
    transition: width 0.3s, height 0.3s;
    will-change: transform;
  }
  body.hovered .cursor {
    width: 60px; height: 60px;
    background: rgba(255, 215, 0, 0.05);
    border: 1px solid rgba(255, 215, 0, 0.8);
    box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
  }
  body.clicking .cursor { transform: translate(-50%, -50%) scale(0.9); background: var(--brand-primary); }

  /* =============================================
     背景光暈
  ============================================= */
  .ambient-light {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0; overflow: hidden;
  }
  .ambient-blob {
    position: absolute;
    width: 900px; height: 900px;
    background: radial-gradient(circle, rgba(255, 140, 0, 0.04) 0%, transparent 60%);
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.5;
    animation: moveBlob 25s infinite alternate ease-in-out;
  }
  .ambient-blob:nth-child(1) { top: -20%; left: -10%; }
  .ambient-blob:nth-child(2) { bottom: -20%; right: -10%; animation-duration: 35s; animation-direction: reverse; }
  @keyframes moveBlob {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(50px, 50px) scale(1.1); }
  }

  /* =============================================
     音效按鈕
  ============================================= */
  #sound-btn {
    position: fixed; bottom: 40px; right: 40px; z-index: 9000;
    display: none;
    gap: 4px; align-items: flex-end; height: 24px;
    cursor: pointer; transition: transform 0.3s;
    background: transparent; border: none; width: auto; padding: 5px;
  }
  #sound-btn:hover { transform: scale(1.1); }
  .sound-label { font-size: 0.75rem; letter-spacing: 2px; color: rgba(255,255,255,0.7); font-weight: 500; margin-right: 5px; }
  .sound-bar { width: 3px; background-color: #fff; opacity: 0.8; border-radius: 2px; height: 3px; transition: height 0.3s, background-color 0.3s; }
  #sound-btn.is-playing .sound-bar { background-color: var(--brand-light); animation: soundWaveAnim 1s ease-in-out infinite; }
  #sound-btn.is-playing .sound-label { color: var(--brand-light); }
  #sound-btn.is-playing .sound-bar:nth-child(1) { animation-delay: 0.0s; }
  #sound-btn.is-playing .sound-bar:nth-child(2) { animation-delay: 0.2s; }
  #sound-btn.is-playing .sound-bar:nth-child(3) { animation-delay: 0.4s; }
  #sound-btn.is-playing .sound-bar:nth-child(4) { animation-delay: 0.1s; }
  @keyframes soundWaveAnim { 0% { height: 3px; } 50% { height: 20px; } 100% { height: 3px; } }

  /* =============================================
     導覽列
  ============================================= */
  .header {
    position: fixed; top: 0; left: 0; width: 100%; padding: 28px 50px;
    display: flex; justify-content: space-between; align-items: center;

  /* ── Logo（所有頁面統一尺寸）── */
  .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; }
  .logo img {

  .logo:hover img { transform: rotate(5deg) scale(1.05); }
  .logo-text { font-family: var(--font-display); font-size: 1.2rem; letter-spacing: 2px; text-transform: uppercase; color: #fff; }
  .logo-text span { color: var(--brand-light); }

  /* ── 桌面版 nav ── */
  .nav { display: flex; gap: 30px; } 
  .nav-item { 
    position: relative; overflow: hidden; height: 24px; cursor: pointer; 
    display: block; color: rgba(255,255,255,0.8); text-decoration: none;
    font-family: var(--font-body); font-size: 0.95rem; letter-spacing: 2px; font-weight: 500; 
  }
  .nav-item span { display: block; transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1); }
  .nav-item .hover-text { position: absolute; top: 100%; left: 0; width: 100%; color: var(--brand-light); }
  .nav-item:hover .original-text { transform: translateY(-100%); }
  .nav-item:hover .hover-text { transform: translateY(-100%); }
  .nav-item.active .original-text { color: var(--brand-light); }

  /* ── 漢堡按鈕 ── */
  .hamburger {
    display: none;
    flex-direction: column;
    gap: 6px;
    cursor: pointer;
    padding: 5px;
    background: transparent;
    border: none;
    z-index: 200;
  }
  .hamburger span {
    width: 24px; height: 2px;
    background: #fff;
    transition: 0.3s;
    display: block;
  }
  .hamburger.active span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
  .hamburger.active span:nth-child(2) { opacity: 0; }
  .hamburger.active span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

  /* ── 手機全螢幕選單 ── */
  .mobile-menu {
    position: fixed; inset: 0;
    background: rgba(5, 5, 5, 0.97);
    backdrop-filter: blur(20px);
    z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .mobile-menu.active { opacity: 1; pointer-events: all; }
  .mobile-nav { display: flex; flex-direction: column; align-items: center; gap: 35px; }
  .mobile-nav-link {
    font-family: var(--font-serif); font-size: 2rem;
    color: #fff; text-decoration: none; font-weight: 700; letter-spacing: 3px;
    opacity: 0; transform: translateY(15px);
    transition: opacity 0.4s, transform 0.4s, color 0.2s;
  }
  .mobile-menu.active .mobile-nav-link { opacity: 1; transform: translateY(0); }
  .mobile-menu.active .mobile-nav-link:nth-child(1) { transition-delay: 0.05s; }
  .mobile-menu.active .mobile-nav-link:nth-child(2) { transition-delay: 0.10s; }
  .mobile-menu.active .mobile-nav-link:nth-child(3) { transition-delay: 0.15s; }
  .mobile-menu.active .mobile-nav-link:nth-child(4) { transition-delay: 0.20s; }
  .mobile-menu.active .mobile-nav-link:nth-child(5) { transition-delay: 0.25s; }
  .mobile-nav-link:hover { color: var(--brand-light); }

  /* =============================================
     Hero 區塊
  ============================================= */
  .hero {
    position: relative; height: 100vh; width: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 0 20px; overflow: hidden; perspective: 1000px;
  }
  .hero::before, .hero::after {
    content: ''; position: absolute; left: 0; width: 100%; height: 0;
    background: #000; z-index: 5; transition: height 1.5s var(--ease-out-expo) 1s;
  }
  .hero::before { top: 0; }
  .hero::after { bottom: 0; }
  .loaded .hero::before, .loaded .hero::after { height: 6vh; } 

  .particles-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; overflow: hidden; }
  .particle {
    position: absolute; background: radial-gradient(circle, var(--brand-light) 0%, transparent 70%);
    border-radius: 50%; opacity: 0; animation: floatParticle 10s infinite ease-in-out;
  }
  @keyframes floatParticle {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    20% { opacity: 0.6; }
    80% { opacity: 0.6; }
    100% { transform: translateY(-120px) translateX(30px); opacity: 0; }
  }

  .bg-video-wrap { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: #000; }
  .video-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); z-index: 1; }
  #bg-video {
    width: 100%; height: 100%; 
    object-fit: contain; object-position: center center;
    filter: brightness(0.95) contrast(1.05) saturate(0.8); 
    transform: scale(1); transition: transform 0.1s linear; will-change: transform;
  }

  .hero-content {
    position: relative; z-index: 10; text-align: center; max-width: 1000px;
    transform-style: preserve-3d; transition: transform 0.1s ease-out; 
  }
  
  .hero-title {
    font-family: var(--font-serif); font-size: clamp(3.5rem, 11vw, 8rem); 
    line-height: 1.1; margin: 0; color: #fff; letter-spacing: 5px;
    background: var(--silver-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 10px 30px rgba(0,0,0,0.8));
    opacity: 1; font-weight: 900; 
  }
  .hero-title span {
    font-family: var(--font-serif); font-weight: 900; font-style: normal;
    background: linear-gradient(135deg, #FFD700 0%, #FF8C00 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 25px rgba(255, 140, 0, 0.6));
    padding-left: 10px; letter-spacing: 5px; 
  }
  
  .hero-subtitle {
    font-family: var(--font-body); font-size: clamp(1rem, 2vw, 1.3rem);
    color: rgba(255,255,255,0.85); margin-top: 30px; letter-spacing: 5px;
    min-height: 1.5em; font-weight: 300;
  }
  
  .shutter-flash { animation: shutterAnim 2.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; }
  @keyframes shutterAnim {
    0% { opacity: 0; filter: blur(20px) brightness(5); letter-spacing: 20px; }
    20% { opacity: 1; filter: blur(5px) brightness(2); }
    30% { opacity: 0.1; filter: brightness(1); }
    40% { opacity: 1; filter: blur(0) brightness(1.5); letter-spacing: 5px; } 
    60% { filter: brightness(1); }
    100% { opacity: 1; filter: blur(0); letter-spacing: 5px; }
  }

  .hero-ctas { margin-top: 60px; display: flex; gap: 25px; justify-content: center; }
  
  .scroll-indicator {
    position: absolute; bottom: 10vh; left: 50%; transform: translateX(-50%);
    z-index: 10; opacity: 0; transition: opacity 1s 2s;
    display: flex; flex-direction: column; align-items: center; gap: 12px; cursor: pointer;
  }
  .loaded .scroll-indicator { opacity: 0.8; }
  .scroll-text { font-size: 0.8rem; letter-spacing: 3px; color: rgba(255,255,255,0.6); font-weight: 300; animation: textBreath 3s infinite alternate; }
  @keyframes textBreath { from { opacity: 0.6; } to { opacity: 1; text-shadow: 0 0 10px rgba(255,255,255,0.3); } }
  .scroll-line { width: 1px; height: 50px; background: linear-gradient(to bottom, var(--brand-light), transparent); animation: scrollDown 2s infinite; box-shadow: 0 0 5px var(--brand-primary); }
  @keyframes scrollDown { 0% { transform: scaleY(0); transform-origin: top; } 50% { transform: scaleY(1); transform-origin: top; } 51% { transform: scaleY(1); transform-origin: bottom; } 100% { transform: scaleY(0); transform-origin: bottom; } }
  .scroll-arrow { color: var(--brand-light); font-size: 1.2rem; animation: arrowBounce 2s infinite; margin-top: -5px; }
  @keyframes arrowBounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-5px); } 60% { transform: translateY(-3px); } }

  /* =============================================
     按鈕
  ============================================= */
  .btn {
    padding: 14px 45px; border-radius: 2px;
    font-family: var(--font-body); font-size: 0.95rem; letter-spacing: 2px;
    text-decoration: none; transition: 0.3s cubic-bezier(0.19, 1, 0.22, 1);
    position: relative; overflow: hidden; font-weight: 500; transform: translate(0,0);
  }
  .btn-primary {
    background: var(--brand-gradient); color: #000; border: none;
    box-shadow: 0 10px 30px rgba(255, 140, 0, 0.25);
  }
  .btn-primary::after {
    content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;

    transform: skewX(-20deg); animation: btnShine 3s infinite; pointer-events: none;
  }
  @keyframes btnShine { 0%, 70% { left: -100%; } 100% { left: 200%; } }
  .btn-primary:hover { box-shadow: 0 20px 40px rgba(255, 140, 0, 0.4); filter: brightness(1.1); }

  }
  .btn-ghost:hover { border-color: var(--brand-primary); color: #fff; background: rgba(255, 140, 0, 0.15); }

  /* =============================================

  ============================================= */
  .services-section { padding: 150px 8%; position: relative; z-index: 2; }
  .section-header { text-align: center; margin-bottom: 80px; position: relative; z-index: 2; }

    -webkit-mask-composite: xor; mask-composite: exclude;

  .service-card:hover { transform: translateY(-5px); box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 30px rgba(255, 140, 0, 0.1); background: rgba(30, 30, 30, 0.8); z-index: 10; }
  .card-number { position: absolute; top: -10px; right: 20px; font-family: var(--font-display); font-size: 8rem; line-height: 1; color: rgba(255, 255, 255, 0.03); pointer-events: none; z-index: 0; transition: 0.5s; }

  <script>
    // --- 防盜機制 ---

      if(e.ctrlKey && (e.keyCode == 'U'.charCodeAt(0) || e.keyCode == 'S'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0))) return false;
    }

    // 預設資料
    const fallbackData = {
      logo: "images/uploads/logo.png",
      video: "https://res.cloudinary.com/dfnfcyglu/video/upload/v1763893930/hero_bg_ickrbe.mp4",
      hero_video_mobile: "https://res.cloudinary.com/dfnfcyglu/video/upload/v1763893930/hero_bg_ickrbe.mp4",

        { title: "\u5f8c\u671f\u526a\u8f2f\u8207\u8abf\u8272", description: "\u900f\u904e\u526a\u8f2f\u7bc0\u594f\u3001\u8072\u97f3\u8a2d\u8a08\u8207\u8272\u5f69\uff0c\u5b8c\u6210\u5f71\u50cf\u7684\u60c5\u7dd2\u8207\u8cea\u611f\u3002", iconClass: "fa-solid fa-pen-fancy" }
      ],
      behind_the_scenes: [
        { image: "https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" },
        { image: "https://images.unsplash.com/photo-1598550476439-6847785fcea6?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" },
        { image: "https://images.unsplash.com/photo-1533561098733-722129d2b276?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" },
        { image: "https://images.unsplash.com/photo-1585644198306-399564c7b275?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" },
        { image: "https://images.unsplash.com/photo-1521791136064-7986c2920216?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" },
        { image: "https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" }
      ]
    };

    let currentData = null;

    document.addEventListener('DOMContentLoaded', () => {
      AOS.init({
        duration: 1000,
        easing: 'ease-out-cubic',
        once: false,
        mirror: true,
        offset: 50
      });

      loadPageData('home', 'content/index.md?v=' + new Date().getTime())
        .then(data => {
          currentData = data || fallbackData;
          initPage(currentData);
        })
        .catch(() => {
          currentData = fallbackData;
          initPage(fallbackData);
        });

      createParticles();
      initCursor();
      initHeroParallax();
      initMagneticButtons();
      initPageTransition();
      initHamburger();
      initSoundToggle();

      const scrollBtn = document.getElementById('scroll-btn');
      if (scrollBtn) {
        scrollBtn.addEventListener('click', () => {
          document.getElementById('services-section').scrollIntoView({ behavior: 'smooth' });
        });
      }
    });

    async function loadPageData(pageName, markdownPath) {
      const firebaseData = await loadFirestorePage(pageName);
      if (firebaseData) return firebaseData;
      const response = await fetch(markdownPath);
      if (!response.ok) throw new Error('CMS Data Not Found');
      const text = await response.text();
      const parts = text.split('---');
      return jsyaml.load(parts.length > 1 ? parts[1] : text);
    }

    async function loadFirestorePage(pageName) {
      try {
        if (window.loadFirebasePage) return await window.loadFirebasePage(pageName);
        const module = await import('./admin/firebase-frontend-loader.js?v=sync-20260605d');
        return await module.loadFirebasePage(pageName);
      } catch (error) {
        console.warn(`[Firebase] ${pageName} fallback to markdown`, error);
        return loadFirestorePageViaRest(pageName);
      }
    }

    async function loadFirestorePageViaRest(pageName) {
      try {
        const projectId = 'uprise-videoproduction-admin';
        const apiKey = 'AIzaSyCyC9CaF36J27mjCl908TFCukNtwAilM4o';
        const url = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/pages/${pageName}?key=${apiKey}`;
        const response = await fetch(url);
        if (!response.ok) return null;
        const doc = await response.json();
        return firestoreFieldsToObject(doc.fields || {});
      } catch (error) {
        console.warn(`[Firebase REST] ${pageName} fallback to markdown`, error);
        return null;
      }
    }

    function firestoreFieldsToObject(fields) {
      const out = {};
      Object.entries(fields || {}).forEach(([key, value]) => out[key] = firestoreValueToJs(value));
      return out;
    }

    function firestoreValueToJs(value) {
      if ('stringValue' in value) return value.stringValue;
      if ('integerValue' in value) return Number(value.integerValue);
      if ('doubleValue' in value) return Number(value.doubleValue);
      if ('booleanValue' in value) return value.booleanValue;
      if ('arrayValue' in value) return (value.arrayValue.values || []).map(firestoreValueToJs);
      if ('mapValue' in value) return firestoreFieldsToObject(value.mapValue.fields || {});
      if ('nullValue' in value) return null;
      return null;
    }

    // ─── 初始化頁面內容 ───
    function initPage(data) {
      // 更新 header logo
      const logoImg = document.querySelector('.logo img');
      if (data.logo && logoImg) logoImg.src = data.logo;

      // 更新 loader logo（如果有橫式 logo 的話）
      // Update loader logo.
      const loaderImg = document.querySelector('.loader-logo-img');
      if (data.logo && loaderImg) loaderImg.src = data.logo;
      
      updateVideoSource();

      // 服務卡片
      const grid = document.getElementById('services-grid');
      grid.innerHTML = '';
      const services = data.services || fallbackData.services;
      services.forEach((item, index) => {
        const num = (index + 1).toString().padStart(2, '0');
        const card = document.createElement('div');
        card.className = 'service-card hover-trigger';
        card.setAttribute('data-aos', 'fade-up');
        card.setAttribute('data-aos-delay', index * 150);
        let iconHtml = '';
        if (item.iconClass) {
          iconHtml = `<i class="${item.iconClass} service-icon-fa"></i>`;
        } else if (fallbackData.services[index]?.iconClass) {
          iconHtml = `<i class="${fallbackData.services[index].iconClass} service-icon-fa"></i>`;
        }
        card.innerHTML = `
          <div class="border-shimmer"></div>
          <div class="border-spotlight"></div>
          <div class="card-bg-spotlight"></div>
          <span class="card-number">${num}</span>
          <div class="service-content-wrap">
            ${iconHtml}
            <h3>${item.title}</h3>
            <p>${item.description}</p>
          </div>
        `;
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          card.style.setProperty('--x', `${e.clientX - rect.left}px`);
          card.style.setProperty('--y', `${e.clientY - rect.top}px`);
        });
        grid.appendChild(card);
      });

      // 工作花絮
      const btsGrid = document.getElementById('bts-grid');
      btsGrid.innerHTML = '';
      const btsData = data.behind_the_scenes || fallbackData.behind_the_scenes;
      if (btsData) {
        btsData.forEach((item, index) => {
          const btsItem = document.createElement('div');
          btsItem.className = 'bts-item hover-trigger';
          btsItem.setAttribute('data-aos', 'zoom-in');
          btsItem.setAttribute('data-aos-delay', index * 100);
          btsItem.innerHTML = `<img src="${item.image}" alt="BTS ${index + 1}" loading="lazy">`;
          btsGrid.appendChild(btsItem);
        });
      }

      setTimeout(() => AOS.refresh(), 100);

      // 載入完成 → 顯示頁面（Apple 風格淡入）
      setTimeout(() => {
        document.querySelector('.loader').classList.add('hidden');
        document.body.classList.remove('loading-state');
        document.body.classList.add('loaded-state', 'loaded');
        setTimeout(() => {
          const subtitle = document.getElementById('hero-subtitle');
          if (subtitle) subtitle.classList.add('shutter-flash');
        }, 600);
      }, 900);
    }

    // ─── 影片來源 ───
    function updateVideoSource() {
      if (!currentData) return;
      const videoEl = document.getElementById('bg-video');
      const isMobile = window.innerWidth <= 768;
      const src = isMobile && currentData.hero_video_mobile
        ? currentData.hero_video_mobile
        : (currentData.hero_video || currentData.video || fallbackData.video);
      if (videoEl.src !== src) videoEl.src = src;
    }
    window.addEventListener('resize', updateVideoSource);

    // ─── Apple 風格轉場 ───
    function initPageTransition() {
      document.querySelectorAll('.page-link').forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          document.body.classList.add('exiting');
          setTimeout(() => { window.location.href = link.getAttribute('href'); }, 350);
        });
      });
    }

    // ─── 漢堡選單 ───
    function initHamburger() {
      const hamburger = document.getElementById('hamburger');
      const mobileMenu = document.getElementById('mobile-menu');
      if (!hamburger || !mobileMenu) return;

      hamburger.addEventListener('click', () => {
        hamburger.classList.toggle('active');
        mobileMenu.classList.toggle('active');
        // 防止背景滾動
        document.body.style.overflow = mobileMenu.classList.contains('active') ? 'hidden' : '';
      });

      mobileMenu.querySelectorAll('.mobile-nav-link').forEach(link => {
        link.addEventListener('click', () => {
          hamburger.classList.remove('active');
          mobileMenu.classList.remove('active');
          document.body.style.overflow = '';
        });
      });
    }

    // ─── 音效切換 ───
    function initSoundToggle() {
      const video = document.getElementById('bg-video');
      const btn = document.getElementById('sound-btn');
      video.muted = true;
      btn.style.display = 'flex';
      btn.addEventListener('click', () => {
        video.muted = !video.muted;
        btn.classList.toggle('is-playing', !video.muted);
      });
    }

    // ─── 滾動事件 ───
    window.addEventListener('scroll', () => {
      const scrollY = window.scrollY;
      const header = document.getElementById('header');
      if (scrollY > 50) header.classList.add('scrolled');
      else header.classList.remove('scrolled');

      const heroVideo = document.getElementById('bg-video');
      if (heroVideo) heroVideo.style.transform = `translateY(${scrollY * 0.3}px)`;

      const footerMark = document.getElementById('footer-mark');
      if (footerMark) {
        const footerOffset = document.querySelector('footer').offsetTop;
        if (scrollY > footerOffset - window.innerHeight) {
          const delta = scrollY - (footerOffset - window.innerHeight);
          footerMark.style.transform = `translate(-50%, -50%) translateY(${delta * -0.1}px)`;
        }
      }
    });

    // ─── Hero 視差 ───
    function initHeroParallax() {
      const hero = document.getElementById('hero-section');
      const content = document.getElementById('hero-content');
      hero.addEventListener('mousemove', (e) => {
        const x = (window.innerWidth / 2 - e.clientX) / 30;
        const y = (window.innerHeight / 2 - e.clientY) / 30;
        content.style.transform = `translate(${x}px, ${y}px)`;
      });
      hero.addEventListener('mouseleave', () => {
        content.style.transform = 'translate(0, 0)';
      });
    }

    // ─── 磁力按鈕 ───
    function initMagneticButtons() {
      document.querySelectorAll('.magnetic-btn').forEach(btn => {
        btn.addEventListener('mousemove', (e) => {
          const rect = btn.getBoundingClientRect();
          const x = e.clientX - rect.left - rect.width / 2;
          const y = e.clientY - rect.top - rect.height / 2;
          btn.style.transform = `translate(${x * 0.3}px, ${y * 0.3}px)`;
        });
        btn.addEventListener('mouseleave', () => {
          btn.style.transform = 'translate(0px, 0px)';
        });
      });
    }

    // ─── 粒子 ───
    function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 25; i++) {
        const p = document.createElement('div');
        p.classList.add('particle');
        const size = Math.random() * 3 + 1 + 'px';
        p.style.width = size; p.style.height = size;
        p.style.left = Math.random() * 100 + '%';
        p.style.top = Math.random() * 100 + '%';
        p.style.animationDelay = Math.random() * 5 + 's';
        p.style.animationDuration = Math.random() * 10 + 10 + 's';
        container.appendChild(p);
      }
    }

    // ─── 自訂游標 ───
    function initCursor() {
      if (!window.matchMedia("(pointer: fine)").matches) return;
      const cursor = document.querySelector('.cursor');
      let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
      let cursorX = mouseX, cursorY = mouseY;
      document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
      document.addEventListener('mousedown', () => document.body.classList.add('clicking'));
      document.addEventListener('mouseup', () => document.body.classList.remove('clicking'));
      function animate() {
        cursorX += (mouseX - cursorX) * 0.5;
        cursorY += (mouseY - cursorY) * 0.5;
        cursor.style.transform = `translate(${cursorX}px, ${cursorY}px) translate(-50%, -50%)`;
        requestAnimationFrame(animate);
      }
      animate();
      document.body.addEventListener('mouseenter', e => {
        if (e.target.closest('.hover-trigger')) document.body.classList.add('hovered');
      }, true);
      document.body.addEventListener('mouseleave', e => {
        if (e.target.closest('.hover-trigger')) document.body.classList.remove('hovered');
      }, true);
    }
  </script>

        }
      });
