<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uprise Transition Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050505;
    --panel: rgba(18, 18, 18, 0.82);
    --line: rgba(255, 255, 255, 0.12);
    --text: #fff;
    --muted: rgba(255, 255, 255, 0.64);
    --gold: #ffd700;
    --orange: #ff8c00;
    --ease: cubic-bezier(0.19, 1, 0.22, 1);
    --serif: "Noto Serif TC", serif;
    --sans: "Noto Sans TC", sans-serif;
    --display: "Italiana", serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    overflow-x: hidden;
  }

  .stage {
    position: relative;
    min-height: 100vh;
    display: grid;
    grid-template-columns: minmax(320px, 440px) 1fr;
    isolation: isolate;
  }

  .stage::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(0, 0, 0, 0.84), rgba(0, 0, 0, 0.22)),
      url("uploads/85c3f506-6a9d-4d62-b523-bd13f0d65315.jpg") center / cover;
    opacity: 0.7;
    z-index: -2;
  }

  .stage::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: linear-gradient(90deg, #000, transparent 70%);
    z-index: -1;
  }

  .controls {
    min-height: 100vh;
    padding: 38px;
    border-right: 1px solid var(--line);
    background: rgba(5, 5, 5, 0.74);
    backdrop-filter: blur(18px);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 42px;
  }

  .brand img {
    width: 42px;
    height: 42px;
    object-fit: contain;
  }

  .brand strong {
    font-family: var(--display);
    font-size: 1.25rem;
    letter-spacing: 0.12em;
    font-weight: 400;
  }

  h1 {
    margin: 0 0 14px;
    font-family: var(--serif);
    font-size: clamp(2.1rem, 5vw, 4.8rem);
    line-height: 1.04;
    font-weight: 900;
  }

  .lead {
    margin: 0 0 30px;
    color: var(--muted);
    line-height: 1.9;
    font-size: 0.98rem;
  }

  .options {
    display: grid;
    gap: 10px;
  }

  button {
    width: 100%;
    display: grid;
    grid-template-columns: 34px 1fr;
    gap: 13px;
    align-items: center;
    min-height: 64px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.055);
    color: var(--text);
    text-align: left;
    font: inherit;
    cursor: pointer;
    transition: transform 0.35s var(--ease), border-color 0.35s var(--ease), background 0.35s var(--ease);
  }

  button:hover,
  button.active {
    transform: translateX(6px);
    border-color: rgba(255, 215, 0, 0.58);
    background: linear-gradient(90deg, rgba(255, 140, 0, 0.2), rgba(255, 255, 255, 0.06));
  }

  .number {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), var(--orange));
    color: #060606;
    font-weight: 900;
  }

  .option-name {
    display: block;
    font-weight: 800;
    letter-spacing: 0.04em;
  }

  .option-note {
    display: block;
    margin-top: 3px;
    color: var(--muted);
    font-size: 0.83rem;
    line-height: 1.45;
  }

  .preview {
    position: relative;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 48px;
    overflow: hidden;
  }

  .browser {
    position: relative;
    width: min(860px, 100%);
    aspect-ratio: 16 / 10;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 8px;
    overflow: hidden;
    background: #080808;
    box-shadow: 0 26px 90px rgba(0, 0, 0, 0.62);
  }

  .browser::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.72)),
      url("uploads/line-album-2024-3-18-241011-5.jpg") center / cover;
    transform: scale(1.02);
  }

  .mock-nav {
    position: absolute;
    inset: 0 0 auto;
    height: 74px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 28px;
    z-index: 2;
  }

  .mock-nav img {
    height: 34px;
    width: auto;
    object-fit: contain;
  }

  .mock-links {
    display: flex;
    gap: 22px;
    color: rgba(255, 255, 255, 0.76);
    font-size: 0.83rem;
    letter-spacing: 0.12em;
  }

  .mock-copy {
    position: absolute;
    left: 40px;
    right: 40px;
    bottom: 44px;
    z-index: 2;
  }

  .mock-kicker {
    display: block;
    margin-bottom: 12px;
    color: var(--gold);
    font-family: var(--display);
    letter-spacing: 0.24em;
  }

  .mock-title {
    margin: 0;
    font-family: var(--serif);
    font-size: clamp(2.2rem, 7vw, 5.6rem);
    line-height: 0.95;
    max-width: 760px;
  }

  .mock-sub {
    margin: 18px 0 0;
    color: rgba(255, 255, 255, 0.72);
    line-height: 1.8;
    max-width: 520px;
  }

  .transition-layer {
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
  }

  .transition-layer span {
    position: absolute;
    display: block;
  }

  .caption {
    position: absolute;
    left: 48px;
    right: 48px;
    bottom: 30px;
    color: rgba(255, 255, 255, 0.68);
    font-size: 0.88rem;
    line-height: 1.8;
  }

  .caption strong {
    color: #fff;
    font-size: 1rem;
  }

  .browser.playing .mock-copy,
  .browser.playing .mock-nav {
    animation: contentSettle 1s var(--ease) both;
  }

  @keyframes contentSettle {
    from { opacity: 0.18; transform: translateY(18px) scale(0.985); filter: blur(6px); }
    to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  .effect-iris .transition-layer {
    background: #030303;
    clip-path: circle(0% at 50% 50%);
    animation: irisOpen 1.05s var(--ease) both;
  }

  .effect-iris .transition-layer::before,
  .effect-iris .transition-layer::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 10%;
    background: #030303;
  }

  .effect-iris .transition-layer::before { top: 0; }
  .effect-iris .transition-layer::after { bottom: 0; }

  @keyframes irisOpen {
    0% { clip-path: circle(0% at 50% 50%); }
    48% { clip-path: circle(18% at 50% 50%); }
    100% { clip-path: circle(150% at 50% 50%); }
  }

  .effect-strips .transition-layer {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }

  .effect-strips .transition-layer span {
    position: relative;
    height: 100%;
    background: #020202;
    transform: translateY(0);
    animation: stripUp 0.92s var(--ease) both;
  }

  .effect-strips .transition-layer span:nth-child(2n) {
    animation-name: stripDown;
  }

  .effect-strips .transition-layer span:nth-child(1) { animation-delay: 0.02s; }
  .effect-strips .transition-layer span:nth-child(2) { animation-delay: 0.08s; }
  .effect-strips .transition-layer span:nth-child(3) { animation-delay: 0.14s; }
  .effect-strips .transition-layer span:nth-child(4) { animation-delay: 0.2s; }
  .effect-strips .transition-layer span:nth-child(5) { animation-delay: 0.26s; }
  .effect-strips .transition-layer span:nth-child(6) { animation-delay: 0.32s; }
  .effect-strips .transition-layer span:nth-child(7) { animation-delay: 0.38s; }

  @keyframes stripUp { to { transform: translateY(-105%); } }
  @keyframes stripDown { to { transform: translateY(105%); } }

  .effect-flash .transition-layer {
    background:
      radial-gradient(circle at 50% 44%, rgba(255, 255, 255, 0.95), rgba(255, 215, 0, 0.5) 18%, rgba(0, 0, 0, 0) 46%),
      rgba(255, 255, 255, 0.9);
    animation: lensFlash 0.9s var(--ease) both;
  }

  @keyframes lensFlash {
    0% { opacity: 1; transform: scale(1); filter: blur(0); }
    35% { opacity: 0.92; transform: scale(1.04); filter: blur(0); }
    100% { opacity: 0; transform: scale(1.28); filter: blur(18px); }
  }

  .effect-shutter .transition-layer {
    overflow: hidden;
  }

  .effect-shutter .transition-layer span {
    inset: 0;
    width: 50%;
    background:
      linear-gradient(90deg, #030303, rgba(3, 3, 3, 0.92)),
      linear-gradient(135deg, rgba(255, 215, 0, 0.18), transparent);
  }

  .effect-shutter .transition-layer span:nth-child(1) {
    left: 0;
    transform-origin: left;
    animation: shutterLeft 0.94s var(--ease) both;
  }

  .effect-shutter .transition-layer span:nth-child(2) {
    left: 50%;
    transform-origin: right;
    animation: shutterRight 0.94s var(--ease) both;
  }

  @keyframes shutterLeft { to { transform: translateX(-102%) skewX(-8deg); } }
  @keyframes shutterRight { to { transform: translateX(102%) skewX(-8deg); } }

  .effect-depth .browser::before {
    animation: imageDepth 1.1s var(--ease) both;
  }

  .effect-depth .transition-layer {
    background: #030303;
    animation: depthCover 0.95s var(--ease) both;
  }

  @keyframes imageDepth {
    0% { transform: scale(1.16); filter: blur(10px) brightness(0.6); }
    100% { transform: scale(1.02); filter: blur(0) brightness(1); }
  }

  @keyframes depthCover {
    0% { opacity: 1; transform: scale(1); }
    42% { opacity: 0.75; }
    100% { opacity: 0; transform: scale(1.08); }
  }

  .effect-gold .transition-layer {
    background: #030303;
    transform-origin: left;
    animation: goldWipe 1.02s var(--ease) both;
  }

  .effect-gold .transition-layer::after {
    content: "";
    position: absolute;
    top: 0;
    right: -16px;
    width: 18px;
    height: 100%;
    background: linear-gradient(180deg, transparent, var(--gold), var(--orange), transparent);
    box-shadow: 0 0 36px rgba(255, 183, 0, 0.78);
  }

  @keyframes goldWipe {
    0% { transform: scaleX(1); }
    100% { transform: scaleX(0); }
  }

  @media (max-width: 920px) {
    .stage {
      grid-template-columns: 1fr;
    }

    .controls {
      min-height: auto;
      border-right: 0;
      border-bottom: 1px solid var(--line);
      padding: 26px;
    }

    .preview {
      min-height: 72vh;
      padding: 26px;
    }

    .mock-links {
      display: none;
    }

    .mock-copy {
      left: 24px;
      right: 24px;
      bottom: 28px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>
<main class="stage">
  <aside class="controls">
    <div class="brand">
      <img src="siteicon.png" alt="Uprise">
      <strong>UPRISE</strong>
    </div>
    <h1>轉場效果選擇</h1>
    <p class="lead">目前的淡出加模糊偏普通。下面這些方向比較像影像公司該有的剪接語言：遮片、快門、閃白、鏡頭推進與金線掃場。</p>
    <div class="options" aria-label="Transition options">
      <button class="active" type="button" data-effect="iris" data-title="Cinematic Iris" data-desc="像鏡頭光圈打開，適合首頁、關於、品牌感比較重的頁面。">
        <span class="number">1</span>
        <span><span class="option-name">Cinematic Iris</span><span class="option-note">光圈遮罩，電影感最強</span></span>
      </button>
      <button type="button" data-effect="strips" data-title="Film Strip Wipe" data-desc="多條畫面像底片格一樣抽離，節奏明確，適合作品列表。">
        <span class="number">2</span>
        <span><span class="option-name">Film Strip Wipe</span><span class="option-note">底片分割，剪接感強</span></span>
      </button>
      <button type="button" data-effect="flash" data-title="Lens Flash Match Cut" data-desc="短促閃白加光暈，像攝影棚燈光切場，速度快且有記憶點。">
        <span class="number">3</span>
        <span><span class="option-name">Lens Flash Match Cut</span><span class="option-note">閃光轉場，俐落高級</span></span>
      </button>
      <button type="button" data-effect="shutter" data-title="Editorial Shutter" data-desc="左右快門打開，穩重乾淨，適合所有內頁作為全站主轉場。">
        <span class="number">4</span>
        <span><span class="option-name">Editorial Shutter</span><span class="option-note">雙片快門，穩定耐看</span></span>
      </button>
      <button type="button" data-effect="depth" data-title="Depth Push" data-desc="畫面從黑場推進並清晰化，像鏡頭對焦完成，適合團隊與服務頁。">
        <span class="number">5</span>
        <span><span class="option-name">Depth Push</span><span class="option-note">景深推進，質感柔和</span></span>
      </button>
      <button type="button" data-effect="gold" data-title="Gold Edge Wipe" data-desc="黑場由金色光刃掃開，最貼近現有橘金品牌色，實作也最輕。">
        <span class="number">6</span>
        <span><span class="option-name">Gold Edge Wipe</span><span class="option-note">金線掃場，品牌一致</span></span>
      </button>
    </div>
  </aside>

  <section class="preview" aria-live="polite">
    <div class="browser effect-iris playing" id="browser">
      <div class="mock-nav">
        <img src="images/uploads/logo.png" alt="Uprise Production">
        <div class="mock-links"><span>WORKS</span><span>TEAM</span><span>ABOUT</span><span>CONTACT</span></div>
      </div>
      <div class="mock-copy">
        <span class="mock-kicker">UPRISE PRODUCTION</span>
        <h2 class="mock-title">影像讓品牌被看見</h2>
        <p class="mock-sub">這裡只是預覽舞台，實際套用時會接在你現在的 `.page-transition-curtain` 與 `body.exiting` 流程上。</p>
      </div>
      <div class="transition-layer" id="transition-layer" aria-hidden="true"></div>
    </div>
    <p class="caption" id="caption"><strong>Cinematic Iris</strong><br>像鏡頭光圈打開，適合首頁、關於、品牌感比較重的頁面。</p>
  </section>
</main>

<script>
  const browser = document.getElementById("browser");
  const layer = document.getElementById("transition-layer");
  const caption = document.getElementById("caption");
  const buttons = document.querySelectorAll("button[data-effect]");
  const paneCounts = { strips: 7, shutter: 2 };

  function fillLayer(effect) {
    layer.innerHTML = "";
    const count = paneCounts[effect] || 0;
    for (let index = 0; index < count; index += 1) {
      layer.appendChild(document.createElement("span"));
    }
  }

  function play(effect, title, desc) {
    buttons.forEach((button) => button.classList.toggle("active", button.dataset.effect === effect));
    browser.className = "browser";
    fillLayer(effect);
    void browser.offsetWidth;
    browser.classList.add(`effect-${effect}`, "playing");
    caption.innerHTML = `<strong>${title}</strong><br>${desc}`;
  }

  buttons.forEach((button) => {
    button.addEventListener("click", () => {
      play(button.dataset.effect, button.dataset.title, button.dataset.desc);
    });
  });

  window.setInterval(() => {
    const active = document.querySelector("button.active[data-effect]");
    if (active) play(active.dataset.effect, active.dataset.title, active.dataset.desc);
  }, 5200);
</script>
</body>
</html>
