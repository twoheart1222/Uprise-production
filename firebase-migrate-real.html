<style>
  :root {
    --bg: #050505; --surface: rgba(18,18,18,0.95); --border: rgba(255,255,255,0.08);

  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 40px 20px; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 860px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 40px; }
  .logo-mark { width: 56px; height: 56px; border-radius: 12px; background: var(--grad); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-family: 'Italiana', serif; font-size: 1.8rem; color: #000; }
  h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: 3px; margin-bottom: 8px; }
  h1 span { background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .desc { color: var(--sub); font-size: 0.9rem; line-height: 1.8; }
  .progress-wrap { margin-bottom: 32px; }
  .progress-label { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--sub); margin-bottom: 8px; }
  .progress-bar { height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: var(--grad); border-radius: 2px; transition: width 0.5s ease; box-shadow: 0 0 10px rgba(255,140,0,0.5); }
  .pages-grid { display: grid; gap: 14px; margin-bottom: 28px; }
  .page-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; transition: border-color 0.3s; }
  .page-card.success { border-color: var(--green); }
  .page-card.error { border-color: var(--red); }
  .page-card.running { border-color: var(--gold); }
  .card-head { padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); cursor: pointer; }
  .card-head:hover { background: rgba(255,255,255,0.02); }
  .card-title { display: flex; align-items: center; gap: 12px; }
  .page-icon { width: 32px; height: 32px; border-radius: 6px; background: rgba(255,140,0,0.1); border: 1px solid rgba(255,140,0,0.2); display: flex; align-items: center; justify-content: center; font-size: 0.85rem; }
  .page-name { font-weight: 700; letter-spacing: 1px; font-size: 0.95rem; }
  .page-id { font-size: 0.72rem; color: var(--sub); margin-top: 2px; }
  .status-badge { font-size: 0.72rem; padding: 3px 10px; border-radius: 20px; font-weight: 700; letter-spacing: 1px; background: rgba(255,255,255,0.05); color: var(--sub); border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s; white-space: nowrap; }
  .success .status-badge { background: rgba(34,197,94,0.1); color: var(--green); border-color: rgba(34,197,94,0.3); }
  .error .status-badge { background: rgba(239,68,68,0.1); color: var(--red); border-color: rgba(239,68,68,0.3); }
  .running .status-badge { background: rgba(255,215,0,0.1); color: var(--gold); border-color: rgba(255,215,0,0.3); animation: blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .card-body { padding: 16px 20px; display: none; }
  .card-body.open { display: block; }
  .data-preview { background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-size: 0.7rem; color: #aaa; font-family: 'Courier New', monospace; max-height: 180px; overflow-y: auto; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
  .error-msg { margin-top: 10px; background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2); border-radius: 6px; padding: 10px 14px; font-size: 0.8rem; color: #fca5a5; line-height: 1.6; display: none; }
  .error-msg.show { display: block; }
  .action-area { text-align: center; margin-bottom: 28px; }
  .btn-migrate { padding: 16px 50px; background: var(--grad); color: #000; border: none; border-radius: 3px; font-family: 'Noto Sans TC', sans-serif; font-size: 1rem; font-weight: 700; letter-spacing: 3px; cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden; }
  .btn-migrate::after { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg,transparent,rgba(255,255,255,0.6),transparent); transform: skewX(-20deg); animation: shine 3s infinite; }
  @keyframes shine { 0%,70%{left:-100%} 100%{left:200%} }
  .btn-migrate:hover:not(:disabled) { filter: brightness(1.15); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255,140,0,0.4); }
  .btn-migrate:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .done-box { background: rgba(34,197,94,0.05); border: 1px solid rgba(34,197,94,0.2); border-radius: 10px; padding: 28px; text-align: center; display: none; margin-bottom: 28px; }
  .done-box.show { display: block; }
  .done-box h2 { font-size: 1.2rem; color: var(--green); letter-spacing: 2px; margin-bottom: 8px; }
  .done-box p { font-size: 0.85rem; color: var(--sub); line-height: 1.9; }
  .chevron { transition: transform 0.3s; font-size: 0.7rem; color: var(--sub); }
  .chevron.open { transform: rotate(180deg); }
  .warning-box { background: rgba(255,140,0,0.05); border: 1px solid rgba(255,140,0,0.2); border-radius: 10px; padding: 18px 22px; font-size: 0.82rem; color: #ccc; line-height: 2; margin-bottom: 28px; }
  .warning-box strong { color: var(--gold); }
  code { background: rgba(255,255,255,0.07); padding: 1px 6px; border-radius: 3px; font-family: 'Courier New', monospace; color: #FFD700; font-size: 0.78rem; }
</style>
</head>

  <div class="warning-box">

  <div class="done-box" id="done-box">

    <h2>遷移完成！</h2>
    <p>所有真實資料已成功寫入 Firebase Firestore。<br>
    請立刻前往 Firebase Console 將安全規則改回正式版本。<br>
    <strong style="color:var(--gold)">此頁面可以關閉。</strong></p>
  </div>
</div>

// 渲染卡片
const cardsEl = document.getElementById('cards');
PAGES.forEach(page => {
  const card = document.createElement('div');
  card.className = 'page-card';
  card.id = 'card-' + page.id;
  card.innerHTML = `
    <div class="card-head" onclick="toggleCard('${page.id}')">
      <div class="card-title">
        <div class="page-icon">${page.icon}</div>
        <div>
          <div class="page-name">${page.name}</div>
          <div class="page-id">pages / ${page.docId}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="status-badge" id="badge-${page.id}">待遷移</span>
        <span class="chevron" id="chev-${page.id}">▼</span>
      </div>
    </div>
    <div class="card-body" id="body-${page.id}">
      <div class="data-preview">${JSON.stringify(page.data, null, 2)}</div>
      <div class="error-msg" id="err-${page.id}"></div>
    </div>
  `;
  cardsEl.appendChild(card);
});

window.toggleCard = (id) => {
  document.getElementById('body-' + id).classList.toggle('open');
  document.getElementById('chev-' + id).classList.toggle('open');
};

let migrating = false;
window.startMigration = async () => {
  if (migrating) return;
  migrating = true;
  const btn = document.getElementById('migrate-btn');
  btn.disabled = true;
  btn.textContent = '遷移中...';
  const total = PAGES.length;
  let done = 0;
  for (const page of PAGES) {
    const card = document.getElementById('card-' + page.id);
    const badge = document.getElementById('badge-' + page.id);
    const errEl = document.getElementById('err-' + page.id);
    card.className = 'page-card running';
    badge.textContent = '寫入中…';
    document.getElementById('prog-text').textContent = `正在寫入：${page.name}`;
    document.getElementById('body-' + page.id).classList.add('open');
    document.getElementById('chev-' + page.id).classList.add('open');
    try {
      await setDoc(doc(db, 'pages', page.docId), page.data);
      card.className = 'page-card success';
      badge.textContent = '✓ 成功';
      errEl.classList.remove('show');
    } catch (e) {
      card.className = 'page-card error';
      badge.textContent = '✗ 失敗';
      errEl.textContent = '錯誤：' + (e.message || e);
      errEl.classList.add('show');
    }
    done++;
    document.getElementById('prog-fill').style.width = (done / total * 100) + '%';
    document.getElementById('prog-pct').textContent = `${done} / ${total}`;
    await new Promise(r => setTimeout(r, 400));
  }
  document.getElementById('prog-text').textContent = '遷移完成';
  document.getElementById('done-box').classList.add('show');
  btn.textContent = '✓ 已完成';
  migrating = false;
};
</script>
