<style>
  /* --- 核心變數 --- */
  :root { 
    --bg-color: #050505; --card-bg: rgba(20, 20, 20, 0.4); 
    --text-main: #FFFFFF; --text-sub: #B0B0B0; 
    --brand-primary: #FF8C00; --brand-light: #FFD700; 
    --brand-gradient: linear-gradient(135deg, #FFD700, #FF8C00);
    --silver-gradient: linear-gradient(to bottom, #ffffff 40%, #a0a0a0 100%);
    --font-display: 'Italiana', serif; --font-body: 'Noto Sans TC', sans-serif; --font-serif: 'Noto Serif TC', serif;
    --ease-out-expo: cubic-bezier(0.19, 1, 0.22, 1);
    --ease-cinematic: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; cursor: none; }
  html { scroll-behavior: smooth; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: #000; }
  ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--brand-primary); }
  ::selection { background: var(--brand-light); color: #000; }
  body { margin: 0; padding: 0; font-family: var(--font-body); background-color: var(--bg-color); color: var(--text-main); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  
  /* 禁止圖片拖曳，但允許點擊穿透 */
  img { -webkit-user-drag: none; pointer-events: none; }

  /* 載入動畫 */
  .page-transition-curtain { display: none; }
  #main-wrapper {
    transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                filter 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  body.loading-state #main-wrapper { opacity: 0; filter: blur(8px); }
  body.loaded-state  #main-wrapper { opacity: 1; filter: blur(0); }
  body.exiting       #main-wrapper { opacity: 0; filter: blur(8px); pointer-events: none; }
  .loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 200000; display: flex; justify-content: center; align-items: center; transition: opacity 0.4s ease, visibility 0.4s; }
  .loader.hidden { opacity: 0; visibility: hidden; }
  /* Logo 動畫 */
  .loader-logo-img { width: auto; height: 70px; max-width: 200px; object-fit: contain; opacity: 0; transform: scale(0.9); filter: blur(8px); animation: loaderReveal 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  @keyframes loaderReveal { 
    0%   { opacity: 0; transform: scale(0.9); filter: blur(8px); } 
    40%  { opacity: 1; transform: scale(1);   filter: blur(0); }
    80%  { opacity: 1; transform: scale(1);   filter: blur(0); }
    100% { opacity: 0; transform: scale(1.05); filter: blur(4px); } 
  }

  /* 游標 */
  .cursor { position: fixed; top: 0; left: 0; width: 12px; height: 12px; background: var(--brand-light); border-radius: 50%; pointer-events: none; z-index: 2147483647; transform: translate(-50%, -50%); box-shadow: 0 0 15px rgba(255, 215, 0, 0.9); transition: width 0.3s, height 0.3s; will-change: transform; }
  body.hovered .cursor { width: 60px; height: 60px; background: rgba(255, 215, 0, 0.05); border: 1px solid rgba(255, 215, 0, 0.8); box-shadow: 0 0 30px rgba(255, 215, 0, 0.4); }
  body.clicking .cursor { transform: translate(-50%, -50%) scale(0.9); background: var(--brand-primary); }
  
  /* 環境 */
  .ambient-light { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
  .ambient-blob { position: absolute; width: 900px; height: 900px; background: radial-gradient(circle, rgba(255, 140, 0, 0.04) 0%, transparent 60%); border-radius: 50%; filter: blur(80px); opacity: 0.5; animation: moveBlob 25s infinite alternate ease-in-out; }
  .ambient-blob:nth-child(1) { top: -20%; left: -10%; } .ambient-blob:nth-child(2) { bottom: -20%; right: -10%; }
  @keyframes moveBlob { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 50px) scale(1.1); } }
  .particles-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; overflow: hidden; }
  .particle { position: absolute; background: radial-gradient(circle, var(--brand-light) 0%, transparent 70%); border-radius: 50%; opacity: 0; animation: floatParticle 10s infinite ease-in-out; }
  @keyframes floatParticle { 0% { transform: translateY(0) translateX(0); opacity: 0; } 20% { opacity: 0.6; } 80% { opacity: 0.6; } 100% { transform: translateY(-120px) translateX(30px); opacity: 0; } }

  /* 導覽列 */
  .header { position: fixed; top: 0; left: 0; width: 100%; padding: 30px 50px; display: flex; justify-content: space-between; align-items: center; z-index: 100; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); transition: all 0.5s; }
  .header.scrolled { background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding: 20px 50px; }
  .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; }
  .logo img { height: 38px; width: auto; max-width: 140px; transition: transform 0.5s; object-fit: contain; }
  .logo:hover img { transform: rotate(5deg) scale(1.05); }
  .nav { display: flex; gap: 30px; } 
  .nav-item { position: relative; overflow: hidden; height: 24px; cursor: pointer; display: block; color: rgba(255,255,255,0.8); font-family: var(--font-body); font-size: 0.95rem; letter-spacing: 2px; font-weight: 500; text-decoration: none; }
  .nav-item span { display: block; transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1); }
  .nav-item .hover-text { position: absolute; top: 100%; left: 0; width: 100%; color: var(--brand-light); }
  .nav-item:hover .original-text { transform: translateY(-100%); } .nav-item:hover .hover-text { transform: translateY(-100%); }
  .nav-item.active .original-text { color: var(--brand-light); }

  /* 漢堡選單 */
  .hamburger { display: none; flex-direction: column; gap: 6px; cursor: pointer; z-index: 200; width: 30px; }
  .hamburger span { width: 100%; height: 2px; background: #fff; transition: 0.3s; }
  .hamburger.active span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
  .hamburger.active span:nth-child(2) { opacity: 0; }
  .hamburger.active span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

  /* 手機版選單 */
  .mobile-menu {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(5, 5, 5, 0.98); backdrop-filter: blur(10px); z-index: 150;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
  }
  .mobile-menu.active { opacity: 1; pointer-events: all; }
  .mobile-nav { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 30px; width: 100%; }
  .mobile-nav-link {
    font-family: var(--font-serif); font-size: 2rem; color: #fff; text-decoration: none;
    margin: 0; font-weight: 700; letter-spacing: 2px;
    opacity: 0; transform: translateY(20px); transition: 0.5s; white-space: nowrap;
  }
  .mobile-menu.active .mobile-nav-link { opacity: 1; transform: translateY(0); }
  .mobile-nav-link:hover { color: var(--brand-light); }
  .mobile-menu.active .mobile-nav-link:nth-child(1) { transition-delay: 0.1s; }
  .mobile-menu.active .mobile-nav-link:nth-child(2) { transition-delay: 0.2s; }
  .mobile-menu.active .mobile-nav-link:nth-child(3) { transition-delay: 0.3s; }
  .mobile-menu.active .mobile-nav-link:nth-child(4) { transition-delay: 0.4s; }
  .mobile-menu.active .mobile-nav-link:nth-child(5) { transition-delay: 0.5s; }

  /* Team Hero */
  main { min-height: 100vh; }
  .team-hero { padding-top: 180px; padding-bottom: 80px; text-align: center; position: relative; z-index: 10; }
  .page-label { font-family: var(--font-display); font-size: 0.9rem; letter-spacing: 4px; color: var(--brand-light); margin-bottom: 20px; display: block; }
  .page-title { font-family: var(--font-serif); font-size: clamp(3rem, 8vw, 5rem); font-weight: 900; color: #fff; line-height: 1.1; margin: 0 0 20px; background: var(--brand-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 30px rgba(255, 140, 0, 0.5)); letter-spacing: 10px; opacity: 0; transform: scale(1.1); filter: blur(5px); transition: all 1.5s var(--ease-cinematic); }
  .page-title.aos-animate { opacity: 1; letter-spacing: 0; transform: scale(1); filter: blur(0); }
  .page-subtitle { font-family: var(--font-body); font-size: 1.1rem; color: rgba(255,255,255,0.7); max-width: 600px; margin: 0 auto; line-height: 1.8; letter-spacing: 1px; }
  .title-divider { width: 0; height: 3px; background: var(--brand-gradient); margin: 40px auto 0; border-radius: 2px; transition: width 1.2s var(--ease-cinematic); }
  .title-divider.aos-animate { width: 80px; }

  /* Team Grid */
  .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 50px; max-width: 1200px; margin: 0 auto 100px; padding: 0 40px; position: relative; z-index: 10; }
  
  /* Member Card - 互動設定 */
  .member-card { 
    background: var(--card-bg); 
    border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; 
    transition: 0.4s var(--ease-out-expo); 
    position: relative; backdrop-filter: blur(10px); 
    display: flex; flex-direction: column; align-items: center; text-align: center; 
    padding: 50px 30px; 
    cursor: pointer; /* 🔴 強制顯示手型游標 */
  }
  
  .member-image-wrap { width: 180px; height: 180px; border-radius: 50%; overflow: hidden; position: relative; border: 3px solid transparent; background: linear-gradient(135deg, #333, #111) padding-box, var(--brand-gradient) border-box; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: transform 0.4s; }
  
  .member-img { 
    width: 100%; height: 100%; 
    object-fit: cover; object-position: center 25%; 
    filter: none; transition: transform 0.8s; 
  }
  
  .member-info { width: 100%; }
  .member-name { font-family: var(--font-serif); font-size: 1.8rem; color: #fff; margin: 0 0 10px; font-weight: 700; letter-spacing: 1px; }
  .member-role { font-family: var(--font-body); font-size: 0.85rem; color: var(--brand-light); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; display: block; font-weight: 600; }
  
  .member-bio { 
    font-family: var(--font-body); font-size: 0.95rem; color: #aaa; line-height: 1.8; margin-bottom: 30px; 
    white-space: pre-wrap; /* 支援後台換行 */
  }
  
  .action-row { display: flex; gap: 15px; justify-content: center; align-items: center; }
  .portfolio-link { font-size: 0.85rem; color: #000; text-decoration: none; background: var(--brand-gradient); padding: 10px 24px; border-radius: 50px; font-weight: 600; letter-spacing: 1px; transition: 0.3s; display: inline-flex; align-items: center; justify-content: center; }
  .portfolio-link:hover { box-shadow: 0 0 20px rgba(255, 140, 0, 0.6); transform: translateY(-2px); filter: brightness(1.1); }
  .portfolio-link.ig-btn { background: transparent; border: 1px solid rgba(255, 255, 255, 0.2); color: rgba(255, 255, 255, 0.8); }
  .portfolio-link.ig-btn:hover { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); border-color: transparent; color: #fff; box-shadow: 0 0 20px rgba(220, 39, 67, 0.6); }
  
  .member-card:hover { transform: translateY(-10px); box-shadow: 0 20px 60px rgba(0,0,0,0.6); border-color: rgba(255, 183, 0, 0.4); background: rgba(30, 30, 30, 0.6); }
  .member-card:hover .member-image-wrap { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 140, 0, 0.3); }
  .member-card:hover .member-img { transform: scale(1.1); }

  /* Footer */
  footer { padding: 120px 8% 60px; border-top: 1px solid rgba(255,255,255,0.05); background: #020202; text-align: center; position: relative; overflow: hidden; }
  .footer-watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: var(--font-display); font-size: 20vw; font-weight: 700; color: rgba(255, 255, 255, 0.02); pointer-events: none; white-space: nowrap; z-index: 0; letter-spacing: 10px; will-change: transform; }
  .footer-content { max-width: 800px; margin: 0 auto; position: relative; z-index: 1; }
  .footer h2 { font-family: var(--font-serif); font-size: 3.5rem; font-weight: 900; margin-bottom: 40px; letter-spacing: 10px; background: linear-gradient(to right, #cfc7bc, #fff, #cfc7bc); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.8)); }
  .footer h2 span { background: var(--brand-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; filter: drop-shadow(0 0 15px rgba(255, 140, 0, 0.5)); }
  .manifesto { font-size: 1.1rem; color: var(--text-sub); line-height: 2; margin-bottom: 50px; font-weight: 300; letter-spacing: 1px; }
  .copyright { font-size: 0.8rem; color: #444; margin-top: 50px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 30px; letter-spacing: 1px; }

  @media (max-width: 768px) {
    .cursor { display: none; }
    .header { padding: 20px; } .nav { display: none; } 
    .hamburger { display: flex; }
    .team-hero { padding-top: 140px; } .page-title { font-size: 3rem; }
    .footer h2 { font-size: 2.5rem; letter-spacing: 5px; }
    .member-card { max-width: 350px; margin: 0 auto; }
  }
</style>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
    document.onkeydown = function(e) { if(e.keyCode == 123) return false; }

    const fallbackData = {
      title: "專業團隊",
      subtitle: "一群對影像充滿熱情的職人",
      members: [
        { name: "林家佑", role: "DIRECTOR", image: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?fit=crop&w=400&h=400&q=80", bio: "專注於電影級影像製作，擅長透過鏡頭語言捕捉情感流動。", portfolio_url: "#", ig_url: "#" }
      ]
    };

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        document.querySelector('.loader').classList.add('hidden');
        document.body.classList.remove('loading-state');
        document.body.classList.add('loaded-state');
        AOS.init({ duration: 1000, easing: 'ease-out-cubic', once: false, mirror: true, offset: 50 });
      }, 1400);

      // 🔴 讀取團隊資料 (防快取)
      fetch('content/team.md?t=' + new Date().getTime())
        .then(r => r.ok ? r.text() : Promise.reject())
        .then(text => {
          const parts = text.split('---');
          const data = jsyaml.load(parts.length > 1 ? parts[1] : text);
          renderTeam(data);
        })
        .catch(err => {
            console.log("Using fallback team data");
            renderTeam(fallbackData);
        });

      // 讀取 Global 設定
      fetch('content/index.md?t=' + new Date().getTime())
        .then(r => r.ok ? r.text() : Promise.reject())
        .then(text => {
            const data = jsyaml.load(text.split('---')[1]);
            if(data.logo) {
                document.querySelector('.logo img').src = data.logo;
                document.querySelector('.loader-logo-img').src = data.logo;
            }
        });

      initCursor(); initPageTransition(); createParticles(); initMagneticButtons(); initSoundToggle(); initMenu();
    });

    // 漢堡選單
    function initMenu() {
        const hamburger = document.getElementById('hamburger-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        if (hamburger && mobileMenu) {
            hamburger.addEventListener('click', () => {
                hamburger.classList.toggle('active');
                mobileMenu.classList.toggle('active');
            });
            document.querySelectorAll('.mobile-nav-link').forEach(link => {
                link.addEventListener('click', () => {
                    hamburger.classList.remove('active');
                    mobileMenu.classList.remove('active');
                });
            });
            mobileMenu.addEventListener('click', (e) => {
                if (e.target === mobileMenu || e.target.classList.contains('mobile-nav')) {
                    hamburger.classList.remove('active');
                    mobileMenu.classList.remove('active');
                }
            });
        }
    }

    function renderTeam(data) {
        if (data.title) document.getElementById('page-title').innerText = data.title;
        if (data.subtitle) document.getElementById('page-subtitle').innerText = data.subtitle;

        const container = document.getElementById('team-container');
        container.innerHTML = ''; 

        if (data.members && data.members.length > 0) {
            data.members.forEach((m, index) => {
                const avatar = m.image || 'https://dummyimage.com/400x400/333/fff&text=No+Img';
                let buttonsHtml = '';
                if (m.portfolio_url) buttonsHtml += `<a href="${m.portfolio_url}" target="_blank" class="portfolio-link hover-trigger">作品集</a>`;
                if (m.ig_url) buttonsHtml += `<a href="${m.ig_url}" target="_blank" class="portfolio-link ig-btn hover-trigger"><i class="fab fa-instagram" style="font-size: 1.1rem;"></i></a>`;

                const card = document.createElement('div');
                card.className = 'member-card hover-trigger'; 
                card.setAttribute('data-aos', 'fade-up');
                card.setAttribute('data-aos-delay', index * 100);
                
                // 🔴 關鍵修復：這裡加入點擊事件
                card.onclick = function() {
                    window.location.href = `member.html?id=${index}`;
                };
                
                card.innerHTML = `
                    <div class="member-image-wrap"><img src="${avatar}" class="member-img" alt="${m.name}"></div>
                    <div class="member-info">
                        <h3 class="member-name">${m.name}</h3><span class="member-role">${m.role}</span>
                        <div class="member-bio">${m.bio || ''}</div>
                        <div class="action-row" onclick="event.stopPropagation()">${buttonsHtml}</div>
                    </div>`;
                container.appendChild(card);
            });
        } else { container.innerHTML = '<p style="text-align:center; color:#666;">尚無成員資料。</p>'; }
        
        setTimeout(() => { AOS.refresh(); initMagneticButtons(); }, 100);
    }

    function initCursor() { if (window.matchMedia("(pointer: fine)").matches) { const cursor = document.querySelector('.cursor'); let mouseX=0, mouseY=0, cursorX=0, cursorY=0; document.addEventListener('mousemove', e => { mouseX=e.clientX; mouseY=e.clientY; }); document.addEventListener('mousedown', () => document.body.classList.add('clicking')); document.addEventListener('mouseup', () => document.body.classList.remove('clicking')); function animate() { cursorX+=(mouseX-cursorX)*0.5; cursorY+=(mouseY-cursorY)*0.5; cursor.style.transform=`translate(${cursorX}px, ${cursorY}px) translate(-50%, -50%)`; requestAnimationFrame(animate); } animate(); document.body.addEventListener('mouseenter', e=>{ if(e.target.closest('.hover-trigger')) document.body.classList.add('hovered'); }, true); document.body.addEventListener('mouseleave', e=>{ if(e.target.closest('.hover-trigger')) document.body.classList.remove('hovered'); }, true); } }
    function createParticles() { const container = document.getElementById('particles'); if(!container) return; for (let i = 0; i < 20; i++) { const p = document.createElement('div'); p.classList.add('particle'); const size = Math.random() * 3 + 1 + 'px'; p.style.width = size; p.style.height = size; p.style.left = Math.random() * 100 + '%'; p.style.top = Math.random() * 100 + '%'; p.style.animationDelay = Math.random() * 5 + 's'; p.style.animationDuration = Math.random() * 10 + 10 + 's'; container.appendChild(p); } }
    function initPageTransition() { document.querySelectorAll('.page-link').forEach(link => { link.addEventListener('click', (e) => { e.preventDefault(); document.body.classList.add('exiting'); setTimeout(() => { window.location.href = link.getAttribute('href'); }, 350); }); }); }
    function initMagneticButtons() { const buttons = document.querySelectorAll('.magnetic-btn'); buttons.forEach(btn => { btn.addEventListener('mousemove', (e) => { const rect = btn.getBoundingClientRect(); const x = e.clientX - rect.left - rect.width / 2; const y = e.clientY - rect.top - rect.height / 2; btn.style.transform = `translate(${x * 0.3}px, ${y * 0.3}px)`; }); btn.addEventListener('mouseleave', () => { btn.style.transform = `translate(0px, 0px)`; }); }); }
    function initSoundToggle() { const btn = document.getElementById('sound-btn'); if(btn) btn.style.display = 'none'; }

    window.addEventListener('scroll', () => {
        const header = document.querySelector('.header');
        if(window.scrollY > 50) header.classList.add('scrolled'); else header.classList.remove('scrolled');
        const footerMark = document.getElementById('footer-mark');
        if(footerMark) { const footerOffset = document.querySelector('footer').offsetTop; if(window.scrollY > footerOffset - window.innerHeight) { const delta = window.scrollY - (footerOffset - window.innerHeight); footerMark.style.transform = `translate(-50%, -50%) translateY(${delta * -0.1}px)`; } }
    });
  </script>
<script src="js/site-fixes.js" defer></script>
</body>
