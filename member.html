<style>
  /* --- 核心變數 (與首頁統一) --- */
  :root {

    --text-main: #FFFFFF;      
    --text-sub: #B0B0B0;

  * { box-sizing: border-box; cursor: none; }

  ::-webkit-scrollbar-track { background: #000; }
  ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--brand-primary); }

  ::selection { background: var(--brand-light); color: #000; }

  body {

  .page-transition-curtain {

  .loader {

    background: #000; z-index: 200000;

    transition: opacity 0.8s ease, visibility 0.8s;

  .loader.hidden { opacity: 0; visibility: hidden; }
  
  /* Logo 電影感聚焦動畫 */
  .loader-logo-img {
    width: auto;
    height: 90px;

    transform: scale(0.8);
    filter: blur(10px);
    animation: cinematicLogoReveal 2.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  
  @keyframes cinematicLogoReveal { 
    0% { 
      opacity: 0; transform: scale(0.8) translateY(10px); filter: blur(10px) brightness(0.5);
    } 
    30% { 
      opacity: 1; transform: scale(1) translateY(0); filter: blur(0px) brightness(1);
    }
    70% {
      opacity: 1; transform: scale(1.05); 
      filter: blur(0px) brightness(1.1) drop-shadow(0 0 15px rgba(255, 215, 0, 0.6));

    100% { 
      opacity: 0; transform: scale(1.15) translateY(-5px); filter: blur(5px) brightness(1.5);
    } 
  }

  /* 游標 */
  .cursor {
    position: fixed; top: 0; left: 0; width: 12px; height: 12px;
    background: var(--brand-light); border-radius: 50%; pointer-events: none; 
    z-index: 2147483647; transform: translate(-50%, -50%);
    box-shadow: 0 0 15px rgba(255, 215, 0, 0.9);
    transition: width 0.3s, height 0.3s; will-change: transform;
  }
  body.hovered .cursor {
    width: 60px; height: 60px; background: rgba(255, 215, 0, 0.05);
    border: 1px solid rgba(255, 215, 0, 0.8); box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
  }
  body.clicking .cursor { transform: translate(-50%, -50%) scale(0.9); background: var(--brand-primary); }

  /* 環境特效 */
  .ambient-light {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0; overflow: hidden;
  }
  .ambient-blob {
    position: absolute; width: 900px; height: 900px;
    background: radial-gradient(circle, rgba(255, 140, 0, 0.04) 0%, transparent 60%);
    border-radius: 50%; filter: blur(80px); opacity: 0.5;
    animation: moveBlob 25s infinite alternate ease-in-out;
  }
  .ambient-blob:nth-child(1) { top: -20%; left: -10%; animation-delay: 0s; }
  .ambient-blob:nth-child(2) { bottom: -20%; right: -10%; animation-duration: 35s; animation-direction: reverse; }
  @keyframes moveBlob { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 50px) scale(1.1); } }

  .particles-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; overflow: hidden; }
  .particle {
    position: absolute; background: radial-gradient(circle, var(--brand-light) 0%, transparent 70%);
    border-radius: 50%; opacity: 0; animation: floatParticle 10s infinite ease-in-out;
  }
  @keyframes floatParticle {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    20% { opacity: 0.6; } 80% { opacity: 0.6; }
    100% { transform: translateY(-120px) translateX(30px); opacity: 0; }
  }

  /* 極簡聲音按鈕 */
  #sound-btn {
    position: fixed; bottom: 40px; right: 40px; z-index: 9000;
    display: none; gap: 4px; align-items: flex-end; height: 24px;

  }
  #sound-btn:hover { transform: scale(1.1); }
  .sound-label { font-family: var(--font-body); font-size: 0.75rem; letter-spacing: 2px; color: rgba(255,255,255,0.7); font-weight: 500; margin-right: 5px; margin-bottom: 2px; }

  #sound-btn.is-playing .sound-label { color: var(--brand-light); }
  @keyframes soundWaveAnim { 0% { height: 3px; } 50% { height: 20px; } 100% { height: 3px; } }

  /* --- 導覽列 --- */
  .header {
    position: fixed; top: 0; left: 0; width: 100%; padding: 30px 50px;
    display: flex; justify-content: space-between; align-items: center;

  .header.scrolled {

  }

  .logo-text { font-family: var(--font-display); font-size: 1.2rem; letter-spacing: 2px; text-transform: uppercase; color: #fff; }
  .logo-text span { color: var(--brand-light); }
  
  .nav { display: flex; gap: 30px; } 
  .nav-item { 
    position: relative; overflow: hidden; height: 24px; cursor: pointer; 
    display: block; color: rgba(255,255,255,0.8); 
    font-family: var(--font-body); font-size: 0.95rem; letter-spacing: 2px;
    font-weight: 500; text-decoration: none;
  }
  .nav-item span.original-text { display: block; transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1); }
  .nav-item span.hover-text { position: absolute; top: 100%; left: 0; width: 100%; color: var(--brand-light); transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1); white-space: nowrap; }
  .nav-item:hover span.original-text { transform: translateY(-100%); }
  .nav-item:hover span.hover-text { transform: translateY(-100%); }
  .nav-item.active span.original-text { color: var(--brand-light); }

  /* --- 成員詳細頁面 (Member Detail) --- */
  .member-detail-section {
    position: relative; 
    min-height: 100vh;
    padding: 140px 20px 100px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
  }

  /* 成員介紹 標題樣式 */
  .member-page-header {
    text-align: center;
    margin-bottom: 60px;
    width: 100%;
    position: relative; z-index: 10;
  }
  .member-page-header .page-label {
    font-family: var(--font-display); font-size: 0.9rem; letter-spacing: 4px;
    color: var(--brand-light); display: block; margin-bottom: 10px;
  }
  .member-page-header .page-main-title {
    font-family: var(--font-serif);
    font-size: clamp(3rem, 8vw, 5rem);
    color: #fff; margin: 0; font-weight: 900;
    background: var(--brand-gradient);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 30px rgba(255, 140, 0, 0.5));
  }
  .member-page-header .title-divider {
    width: 80px; height: 3px; background: var(--brand-gradient);
    margin: 40px auto 0; border-radius: 2px;
  }

  .profile-container { 
    display: flex; flex-wrap: wrap; max-width: 1000px; width: 100%; 
    gap: 60px; align-items: center; position: relative; z-index: 10;
  }

  /* 相片區塊 */
  .photo-section { 
    flex: 0 0 auto; position: relative; display: flex; justify-content: center;
  }
  
  .photo-frame { 
    width: 280px; height: 280px; 
    position: relative; 
    display: flex; justify-content: center; align-items: center;
  }

  .photo-frame::before {
    content: ''; position: absolute; inset: -15px; border-radius: 50%;
    border: 1px dashed rgba(255, 215, 0, 0.3);
    animation: rotateRing 30s linear infinite;
    pointer-events: none; z-index: 0;
  }

  .photo-frame::after {
    content: ''; position: absolute; inset: -4px; border-radius: 50%;
    padding: 2px; background: var(--brand-gradient); 
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    opacity: 0.8;
    animation: breatheGlow 4s ease-in-out infinite;
    pointer-events: none; z-index: 1;
  }

  .img-inner {
    width: 100%; height: 100%;
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    z-index: 2; 
    box-shadow: 0 0 30px rgba(0,0,0,0.8);
  }

  /* 自動人臉置中 */
  .profile-img { 
    width: 100%; height: 100%; 
    object-fit: cover; 
    object-position: center 25%; /* 讓臉部更居中 (上方 25%) */
    filter: blur(10px) brightness(1.5); 
    transform: scale(1.3);
    transition: all 1.8s var(--ease-cinematic);
    will-change: transform, filter;
  }
  
  .photo-section.aos-animate .profile-img {
    filter: blur(0) brightness(1);
    transform: scale(1);
  }

  .shutter-mask {
    position: absolute; inset: 0; background: #000;
    border-radius: 50%; z-index: 10;
    transform: scale(1);
    transform-origin: center;
    transition: transform 1.2s cubic-bezier(0.8, 0, 0.2, 1);
  }
  .photo-section.aos-animate .shutter-mask {
    transform: scale(0); 
  }

  @keyframes rotateRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes breatheGlow { 
    0%, 100% { opacity: 0.5; filter: drop-shadow(0 0 5px rgba(255,140,0,0.3)); }
    50% { opacity: 1; filter: drop-shadow(0 0 15px rgba(255,215,0,0.6)); }
  }

  .photo-frame:hover .profile-img { transform: scale(1.05); }
  .photo-frame:hover::before { border-color: var(--brand-light); animation-duration: 10s; }
  .photo-frame:hover::after { opacity: 1; filter: drop-shadow(0 0 20px rgba(255,215,0,0.8)); }

  /* 資訊區域 */
  .info-section { 
    flex: 1; display: flex; flex-direction: column; justify-content: center; padding-left: 20px;
  }

  .member-name { 
    font-family: var(--font-serif); 
    font-size: 3.5rem; font-weight: 900; 
    margin: 0 0 10px; line-height: 1.1;
    background: var(--silver-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
    opacity: 0; letter-spacing: 15px; filter: blur(10px); transform: scale(1.1);
    transition: all 1.5s var(--ease-cinematic);
  }
  .member-name.aos-animate { opacity: 1; letter-spacing: 0; filter: blur(0); transform: scale(1); }
  
  .job-title { 
    font-family: var(--font-display);
    font-size: 1rem; text-transform: uppercase; letter-spacing: 4px; 
    color: var(--brand-light); 
    font-weight: 700; margin-bottom: 30px; display: inline-block;
    padding-bottom: 10px; position: relative;
  }
  .job-title::after {
    content: ''; position: absolute; bottom: 0; left: 0;
    width: 0; height: 1px; background: var(--brand-primary);
    transition: width 1.2s var(--ease-cinematic) 0.5s;
  }
  .job-title.aos-animate::after { width: 100%; }
  
  .bio-text { 
    color: #ccc; font-size: 1rem; 
    line-height: 1.6; /* 行距 */
    margin-bottom: 40px; 
    text-align: justify; font-weight: 300; letter-spacing: 1px;
    max-width: 600px;
  }

  /* 按鈕區 */
  .action-buttons { display: flex; gap: 20px; margin-top: 10px; flex-wrap: wrap; }
  
  .btn {
    padding: 12px 30px; border-radius: 2px;
    font-family: var(--font-body); font-size: 0.9rem; letter-spacing: 2px;
    text-decoration: none; transition: 0.3s cubic-bezier(0.19, 1, 0.22, 1);
    position: relative; overflow: hidden; font-weight: 500; transform: translate(0,0);
    display: inline-flex; align-items: center; gap: 8px; justify-content: center;
  }
  
  .btn-primary {
    background: var(--brand-gradient); color: #000; border: none;
    box-shadow: 0 10px 30px rgba(255, 140, 0, 0.25);
  }
  .btn-primary::after {
    content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
    transform: skewX(-20deg); animation: btnShine 3s infinite; pointer-events: none;
  }
  @keyframes btnShine { 0%, 70% { left: -100%; } 100% { left: 200%; } }
  .btn-primary:hover { box-shadow: 0 20px 40px rgba(255, 140, 0, 0.4); filter: brightness(1.1); }

  .btn-ghost {
    background: rgba(255,255,255,0.05); color: #fff; 
    border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(5px);
  }
  .btn-ghost:hover { border-color: var(--brand-primary); color: #fff; background: rgba(255, 140, 0, 0.15); }

  /* IG 按鈕 */
  .btn-instagram {
    background: rgba(255,255,255,0.05); color: #fff; 
    border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(5px);
    transition: 0.3s;
  }
  .btn-instagram:hover {
    background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888) !important;
    border-color: transparent !important;
    box-shadow: 0 10px 30px rgba(220, 39, 67, 0.5) !important;
    color: #fff !important;
    transform: translateY(-2px);
  }
  .btn-instagram:hover i, .btn-instagram:hover span {
    color: #fff !important;
    background: none !important;
    -webkit-text-fill-color: #fff !important;
  }

  /* Footer */
  footer {

    background: #020202; text-align: center; position: relative; overflow: hidden;
  }
  .footer-watermark {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-family: var(--font-display); font-size: 20vw; font-weight: 700;
    color: rgba(255, 255, 255, 0.02); pointer-events: none; white-space: nowrap;
    z-index: 0; letter-spacing: 10px; will-change: transform; 
  }
  .footer-content { max-width: 800px; margin: 0 auto; position: relative; z-index: 1; }
  .footer h2 {
    font-family: var(--font-serif); font-size: 3.5rem; font-weight: 900;
    margin-bottom: 40px; letter-spacing: 10px;
    background: linear-gradient(to right, #cfc7bc, #fff, #cfc7bc);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.8));
  }
  .footer h2 span {
    background: var(--brand-gradient); -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; font-weight: 900; filter: drop-shadow(0 0 15px rgba(255, 140, 0, 0.5));
  }
  .manifesto { font-size: 1.1rem; color: var(--text-sub); line-height: 2; margin-bottom: 50px; font-weight: 300; letter-spacing: 1px; }
  .copyright { font-size: 0.8rem; color: #444; margin-top: 50px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 30px; letter-spacing: 1px; }

  /* RWD */
  @media (max-width: 900px) {
    .member-detail-section { padding-top: 140px; }

    .member-name { font-size: 2.8rem; }

    .footer h2 { font-size: 2.5rem; letter-spacing: 5px; }
    .header { padding: 20px; }
    .nav { display: none; }
    /* 🔴 新增：隱藏手機版自訂游標 */
    .cursor { display: none; }
  }
</style>

        <a href="about.html" class="nav-item hover-trigger page-link">
            <span class="original-text">關於</span><span class="hover-text">關於</span>
        </a>
        <a href="contact.html" class="nav-item hover-trigger page-link">
            <span class="original-text">聯絡</span><span class="hover-text">聯絡</span>
        </a>
      </nav>
    </header>

    <main>
      <section class="member-detail-section">
        <!-- 成員介紹標題區塊 -->
        <div class="member-page-header" data-aos="fade-down" data-aos-delay="100">
            <span class="page-label">MEMBER PROFILE</span>
            <h1 class="page-main-title">成員介紹</h1>
            <div class="title-divider"></div>
        </div>

        <!-- 內容容器 -->
        <div class="profile-container" id="profile-content">
          <p style="width:100%; text-align:center; color:#666;">Loading Profile...</p>
        </div>
      </section>
    </main>

    <footer>
      <div class="footer-watermark" id="footer-mark">UPRISE</div>
      <div class="footer-content" data-aos="fade-up" data-aos-offset="50">
        <h2>推手<span>影像</span></h2>
        <p class="manifesto">
          我們不僅是影像的製造者，更是品牌價值的推動者。<br>
          致力於將抽象的意念，轉化為具象的視覺衝擊。<br>
          從腳本企劃、電影級拍攝到後期特效，<br>
          推手影像以極致的職人精神，訴說每一個值得被看見的故事。
        </p>
        <div class="copyright">
          Copyright © 2025 推手影像製作有限公司 Uprise-Production. All rights reserved.<br>
          臺中市西區民龍里臺灣大道二段285號31樓 | +886 937672279
        </div>
      </div>
    </footer>
  </div>

  <!-- AOS Script -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

  <script>
    // --- 防盜機制 (Anti-Theft) ---
    // 1. 禁止右鍵
    document.addEventListener('contextmenu', event => event.preventDefault());

    // 2. 禁止複製 (但允許選取文字)
    document.addEventListener('copy', event => {
        event.preventDefault();
    });

    // 3. 禁止快速鍵 (F12, Ctrl+U, Ctrl+S, Ctrl+C, Ctrl+Shift+I)
    document.onkeydown = function(e) {
        if(e.keyCode == 123) { // F12
            return false;
        }
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { // Ctrl+Shift+I
            return false;
        }
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { // Ctrl+Shift+C
            return false;
        }
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { // Ctrl+Shift+J
            return false;
        }
        if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { // Ctrl+U
            return false;
        }
        if(e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) { // Ctrl+S
            return false;
        }
        if(e.ctrlKey && e.keyCode == 'C'.charCodeAt(0)) { // Ctrl+C
             return false;
        }
    }

    // 預設資料
    const fallbackData = {
      members: [
        {
          name: "林家佑",
          role: "DIRECTOR",
          avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?fit=crop&w=400&h=533&q=80",
          bio: "專注於電影級影像製作，擅長透過鏡頭語言捕捉情感流動。",
          full_bio: "林家佑導演擁有超過十年的影像製作經驗，擅長以電影敘事手法拍攝商業廣告與品牌形象影片。他的作品風格細膩且充滿張力，能夠精準捕捉人物情感與光影變化，為品牌創造獨特的視覺語言。",
          portfolio_url: "#",
          ig_url: "#"
        }
      ]
    };

    document.addEventListener('DOMContentLoaded', () => {
      // 1. 載入動畫 (延遲 2.2s)
      setTimeout(() => {
        document.querySelector('.loader').classList.add('hidden');
        document.querySelector('.page-transition-curtain').classList.add('reveal');
        document.body.classList.remove('loading-state');
        document.body.classList.add('loaded-state');
        
        AOS.init({
            duration: 1000,
            easing: 'ease-out-cubic',
            once: false,
            mirror: true,
            offset: 50
        });
      }, 2200); 

      // 讀取成員 ID
      const urlParams = new URLSearchParams(window.location.search);
      const memberId = urlParams.get('id') || 0; 

      // 🔴 2. 跨頁讀取首頁設定 (Favicon & Logo)
      fetch('content/index.md')
        .then(r => r.ok ? r.text() : Promise.reject())
        .then(text => {
          const parts = text.split('---');
          const data = jsyaml.load(parts.length > 1 ? parts[1] : text);
          
          let logoUrl = data.logo;
          let faviconUrl = data.favicon || data.logo;

          if(logoUrl) {
            const navLogo = document.querySelector('.logo img');
            if(navLogo) navLogo.src = logoUrl;
            const loaderLogo = document.querySelector('.loader-logo-img');
            if(loaderLogo) loaderLogo.src = logoUrl;
          }
          if(faviconUrl) {
            const favicon = document.querySelector('link[rel="icon"]');
            if(favicon) favicon.href = faviconUrl;
          }
        })
        .catch(e => console.log("Global settings not found"));

      // 🔴 3. 讀取團隊資料 (Team.md)
      fetch('content/team.md')
        .then(r => {
            if(!r.ok) throw new Error("CMS Data Not Found");
            return r.text();
        })
        .then(text => {
          const parts = text.split('---');
          const data = jsyaml.load(parts.length > 1 ? parts[1] : text);
          renderMember(data, memberId);
        })
        .catch(err => {
            console.log("Using fallback member data");
            const mockData = { members: fallbackData.members };
            renderMember(mockData, 0); 
        });

      initCursor();
      initPageTransition();
      createParticles();
      initMagneticButtons();
      initSoundToggle(); 
    });

    function renderMember(data, id) {
      const container = document.getElementById('profile-content');
      
      if(data.members && data.members[id]) {
        const m = data.members[id];
        // 兼容 avatar / image 兩種欄位名稱
        const avatar = m.avatar || m.image || 'https://dummyimage.com/400x533/333/fff';
        
        const bioContent = m.full_bio ? m.full_bio : m.bio;
        const bioHtml = new showdown.Converter().makeHtml(bioContent || '');
        
        const portfolioBtn = m.portfolio_url 
            ? `<a href="${m.portfolio_url}" target="_blank" class="btn btn-primary hover-trigger magnetic-btn">查看作品集</a>` 
            : '';
            
        const igBtn = m.ig_url
            ? `<a href="${m.ig_url}" target="_blank" class="btn btn-ghost btn-instagram hover-trigger magnetic-btn"><i class="fab fa-instagram"></i> <span>Instagram</span></a>`
            : '';

        // 動態 SEO 更新
        document.title = `${m.name} ${m.role} | 成員介紹 | 推手影像 Uprise Production`;
        
        const setMeta = (name, content) => {
            let element = document.querySelector(`meta[name="${name}"]`);
            if (!element) {
                element = document.createElement('meta');
                element.name = name;
                document.head.appendChild(element);
            }
            element.content = content;
        };
        const setOgMeta = (property, content) => {
            let element = document.querySelector(`meta[property="${property}"]`);
            if (!element) {
                element = document.createElement('meta');
                element.setAttribute('property', property);
                document.head.appendChild(element);
            }
            element.content = content;
        };

        const pageUrl = window.location.href;
        const description = `推手影像 (Uprise Production) 專業團隊成員介紹：${m.name}擔任${m.role}。${m.bio ? m.bio.substring(0, 150) : ''}...`;
        const keywords = `${m.name}, ${m.name}導演, ${m.name}${m.role}, 推手影像${m.name}, Uprise Production ${m.name}, 影像製作團隊`;

        setMeta('description', description);
        setMeta('keywords', keywords);
        
        setOgMeta('og:title', `${m.name} ${m.role} | 推手影像 Uprise Production`);
        setOgMeta('og:description', description);
        setOgMeta('og:image', avatar.startsWith('http') ? avatar : window.location.origin + '/' + avatar);
        setOgMeta('og:url', pageUrl);
        
        const schema = {
            "@context": "https://schema.org",
            "@type": "Person",
            "name": m.name,
            "jobTitle": m.role,
            "image": avatar,
            "description": m.bio,
            "url": pageUrl,
            "worksFor": {
                "@type": "Organization",
                "name": "推手影像 Uprise Production",
                "url": window.location.origin
            },
            "sameAs": []
        };
        if(m.ig_url) schema.sameAs.push(m.ig_url);
        if(m.portfolio_url) schema.sameAs.push(m.portfolio_url);
        
        const oldSchema = document.getElementById('dynamic-schema');
        if (oldSchema) oldSchema.remove();
        
        const script = document.createElement('script');
        script.id = "dynamic-schema";
        script.type = "application/ld+json";
        script.text = JSON.stringify(schema);
        document.head.appendChild(script);

        // 渲染畫面
        container.innerHTML = `
            <div class="photo-section" data-aos="fade" data-aos-duration="1500">
              <div class="photo-frame">
                <div class="img-inner">
                    <img src="${avatar}" class="profile-img" alt="${m.name} - ${m.role} | 推手影像">
                    <div class="shutter-mask"></div>
                </div>
              </div>
            </div>

            <div class="info-section">
              <h2 class="member-name" data-aos="fade" data-aos-delay="200" data-aos-duration="1000">${m.name}</h2>
              
              <div data-aos="fade-up" data-aos-delay="600" data-aos-duration="1000">
                  <span class="job-title">${m.role}</span>
              </div>
              
              <div class="bio-text" data-aos="fade-up" data-aos-delay="800" data-aos-duration="1000">${bioHtml}</div>
              
              <div class="action-buttons" data-aos="fade-up" data-aos-delay="1000" data-aos-duration="1000">
                <a href="team.html" class="btn btn-ghost hover-trigger magnetic-btn">← 返回團隊</a>
                ${portfolioBtn}
                ${igBtn}
              </div>
            </div>
        `;
        
        setTimeout(() => {
            AOS.refresh();
            initMagneticButtons();
        }, 100);
      } else {
        container.innerHTML = '<p style="width:100%; text-align:center;">查無此成員資料。</p>';
      }
    }

    function initCursor() { if (window.matchMedia("(pointer: fine)").matches) { const cursor = document.querySelector('.cursor'); let mouseX=0, mouseY=0, cursorX=0, cursorY=0; document.addEventListener('mousemove', e => { mouseX=e.clientX; mouseY=e.clientY; }); document.addEventListener('mousedown', () => document.body.classList.add('clicking')); document.addEventListener('mouseup', () => document.body.classList.remove('clicking')); function animate() { cursorX+=(mouseX-cursorX)*0.5; cursorY+=(mouseY-cursorY)*0.5; cursor.style.transform=`translate(${cursorX}px, ${cursorY}px) translate(-50%, -50%)`; requestAnimationFrame(animate); } animate(); document.body.addEventListener('mouseenter', e=>{ if(e.target.closest('.hover-trigger')) document.body.classList.add('hovered'); }, true); document.body.addEventListener('mouseleave', e=>{ if(e.target.closest('.hover-trigger')) document.body.classList.remove('hovered'); }, true); } }
    function createParticles() { const container = document.getElementById('particles'); if(!container) return; for (let i = 0; i < 20; i++) { const p = document.createElement('div'); p.classList.add('particle'); const size = Math.random() * 3 + 1 + 'px'; p.style.width = size; p.style.height = size; p.style.left = Math.random() * 100 + '%'; p.style.top = Math.random() * 100 + '%'; p.style.animationDelay = Math.random() * 5 + 's'; p.style.animationDuration = Math.random() * 10 + 10 + 's'; container.appendChild(p); } }
    function initPageTransition() { const links = document.querySelectorAll('.page-link'); const curtain = document.querySelector('.page-transition-curtain'); links.forEach(link => { link.addEventListener('click', (e) => { e.preventDefault(); const href = link.getAttribute('href'); curtain.classList.remove('reveal'); curtain.classList.add('cover'); setTimeout(() => { window.location.href = href; }, 800); }); }); }
    function initMagneticButtons() { const buttons = document.querySelectorAll('.magnetic-btn'); buttons.forEach(btn => { btn.addEventListener('mousemove', (e) => { const rect = btn.getBoundingClientRect(); const x = e.clientX - rect.left - rect.width / 2; const y = e.clientY - rect.top - rect.height / 2; btn.style.transform = `translate(${x * 0.3}px, ${y * 0.3}px)`; }); btn.addEventListener('mouseleave', () => { btn.style.transform = `translate(0px, 0px)`; }); }); }
    function initSoundToggle() { const btn = document.getElementById('sound-btn'); if(btn) btn.style.display = 'none'; }

    window.addEventListener('scroll', () => {
        const header = document.querySelector('.header');
        if(window.scrollY > 50) header.classList.add('scrolled');
        else header.classList.remove('scrolled');

        const footerMark = document.getElementById('footer-mark');
        if(footerMark) {
            const footerOffset = document.querySelector('footer').offsetTop;
            if(window.scrollY > footerOffset - window.innerHeight) {
                const delta = window.scrollY - (footerOffset - window.innerHeight);
                footerMark.style.transform = `translate(-50%, -50%) translateY(${delta * -0.1}px)`;
            }
        }
    });
  </script>
</body>
</html>
