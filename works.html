<style>
  /* --- 核心變數 (完全同步 Index) --- */

    --text-sub: #B0B0B0; 
    --brand-primary: #FF8C00; 
    --brand-light: #FFD700;

    --font-display: 'Italiana', serif;
    --font-body: 'Noto Sans TC', sans-serif;
    --font-serif: 'Noto Serif TC', serif;
    
    --ease-out-expo: cubic-bezier(0.19, 1, 0.22, 1);
    --ease-cinematic: cubic-bezier(0.22, 1, 0.36, 1);

  * { box-sizing: border-box; cursor: none; }

  html { scroll-behavior: smooth; }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: #000; }
  ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--brand-primary); }

  ::selection { background: var(--brand-light); color: #000; }

  body {
    margin: 0; padding: 0;
    font-family: var(--font-body);

  /* 禁止圖片拖曳 (防盜) */

  /* --- 載入動畫 (Loader) - 與 Index 同步 --- */

  body.loading-state #main-wrapper { opacity: 0; filter: blur(8px); }
  body.loaded-state  #main-wrapper { opacity: 1; filter: blur(0); }
  body.exiting       #main-wrapper { opacity: 0; filter: blur(8px); pointer-events: none; }

  .loader {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; z-index: 200000; 
    display: flex; justify-content: center; align-items: center;
    transition: opacity 0.4s ease, visibility 0.4s;
  }
  .loader.hidden { opacity: 0; visibility: hidden; }
  
  /* Logo 電影感聚焦動畫 */
  .loader-logo-img {
    width: auto; height: 70px; max-width: 200px; object-fit: contain;
    opacity: 0; transform: scale(0.9); filter: blur(8px);
    animation: loaderReveal 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes loaderReveal { 
    0%   { opacity: 0; transform: scale(0.9); filter: blur(8px); } 
    40%  { opacity: 1; transform: scale(1);   filter: blur(0); }
    80%  { opacity: 1; transform: scale(1);   filter: blur(0); }
    100% { opacity: 0; transform: scale(1.05); filter: blur(4px); } 
  }

  /* 游標 */
  .cursor {
    position: fixed; top: 0; left: 0; width: 12px; height: 12px;
    background: var(--brand-light); border-radius: 50%; pointer-events: none; 
    z-index: 2147483647; transform: translate(-50%, -50%);
    box-shadow: 0 0 15px rgba(255, 215, 0, 0.9);
    transition: width 0.3s, height 0.3s; will-change: transform;
  }
  body.hovered .cursor {
    width: 60px; height: 60px; background: rgba(255, 215, 0, 0.05);
    border: 1px solid rgba(255, 215, 0, 0.8); box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
  }
  body.clicking .cursor { transform: translate(-50%, -50%) scale(0.9); background: var(--brand-primary); }

  /* 環境特效 */
  .ambient-light {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0; overflow: hidden;
  }
  .ambient-blob {
    position: absolute; width: 900px; height: 900px;
    background: radial-gradient(circle, rgba(255, 140, 0, 0.04) 0%, transparent 60%);
    border-radius: 50%; filter: blur(80px); opacity: 0.5;
    animation: moveBlob 25s infinite alternate ease-in-out;
  }
  .ambient-blob:nth-child(1) { top: -20%; left: -10%; animation-delay: 0s; }
  .ambient-blob:nth-child(2) { bottom: -20%; right: -10%; animation-duration: 35s; animation-direction: reverse; }
  @keyframes moveBlob { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 50px) scale(1.1); } }

  .particles-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; overflow: hidden; }
  .particle {
    position: absolute; background: radial-gradient(circle, var(--brand-light) 0%, transparent 70%);
    border-radius: 50%; opacity: 0; animation: floatParticle 10s infinite ease-in-out;
  }
  @keyframes floatParticle {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    20% { opacity: 0.6; } 80% { opacity: 0.6; }
    100% { transform: translateY(-120px) translateX(30px); opacity: 0; }
  }

  /* --- 導覽列 --- */
  .header {
    position: fixed; top: 0; left: 0; width: 100%; padding: 30px 50px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 100; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); 
    transition: all 0.5s;
  }
  .header.scrolled { 
    background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(20px); 
    border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding: 20px 50px;
  }
  .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; }
  .logo img { height: 38px; width: auto; max-width: 140px; transition: transform 0.5s; object-fit: contain; }
  .logo:hover img { transform: rotate(5deg) scale(1.05); }
  .logo-text { font-family: var(--font-display); font-size: 1.2rem; letter-spacing: 2px; text-transform: uppercase; color: #fff; }

  .nav { display: flex; gap: 30px; } 
  .nav-item { position: relative; overflow: hidden; height: 24px; cursor: pointer; display: block; color: rgba(255,255,255,0.8); font-family: var(--font-body); font-size: 0.95rem; letter-spacing: 2px; font-weight: 500; text-decoration: none; }
  .nav-item span { display: block; transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1); }
  .nav-item .hover-text { position: absolute; top: 100%; left: 0; width: 100%; color: var(--brand-light); }
  .nav-item:hover .original-text { transform: translateY(-100%); } .nav-item:hover .hover-text { transform: translateY(-100%); }
  .nav-item.active .original-text { color: var(--brand-light); }

  /* 漢堡選單按鈕 */
  .hamburger {
    display: none; flex-direction: column; gap: 6px; cursor: pointer; z-index: 200; width: 30px;
  }
  .hamburger span { width: 100%; height: 2px; background: #fff; transition: 0.3s; }
  .hamburger.active span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
  .hamburger.active span:nth-child(2) { opacity: 0; }
  .hamburger.active span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

  /* 🔴 手機版選單 (與 Index 完全一致：直式排列) */
  .mobile-menu {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(5, 5, 5, 0.98); 
    backdrop-filter: blur(10px);
    z-index: 150;

    opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
  }
  .mobile-menu.active { opacity: 1; pointer-events: all; }
  
  .mobile-nav {
    display: flex; flex-direction: column; justify-content: center; align-items: center; 
    gap: 30px; width: 100%;
  }

  .mobile-nav-link {
    font-family: var(--font-serif); font-size: 2rem; color: #fff; text-decoration: none;

  }
  .mobile-menu.active .mobile-nav-link { opacity: 1; transform: translateY(0); }
  .mobile-nav-link:hover { color: var(--brand-light); }
  
  /* 依序延遲進場 */
  .mobile-menu.active .mobile-nav-link:nth-child(1) { transition-delay: 0.1s; }
  .mobile-menu.active .mobile-nav-link:nth-child(2) { transition-delay: 0.2s; }
  .mobile-menu.active .mobile-nav-link:nth-child(3) { transition-delay: 0.3s; }
  .mobile-menu.active .mobile-nav-link:nth-child(4) { transition-delay: 0.4s; }
  .mobile-menu.active .mobile-nav-link:nth-child(5) { transition-delay: 0.5s; }

  /* --- Works 專用樣式 --- */
  .works-hero { padding-top: 180px; padding-bottom: 80px; text-align: center; position: relative; z-index: 10; }
  .page-label { font-family: var(--font-display); font-size: 0.9rem; letter-spacing: 4px; color: var(--brand-light); margin-bottom: 20px; display: block; }
  .page-title { font-family: var(--font-serif); font-size: clamp(3rem, 8vw, 5rem); font-weight: 900; color: #fff; line-height: 1.1; margin: 0 0 20px; background: var(--brand-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 30px rgba(255, 140, 0, 0.5)); opacity: 0; transform: scale(1.1); filter: blur(5px); transition: all 1.5s var(--ease-cinematic); }

  .page-subtitle { font-family: var(--font-body); font-size: 1.1rem; color: rgba(255,255,255,0.7); max-width: 600px; margin: 0 auto; line-height: 1.8; letter-spacing: 1px; }

  .works-container { max-width: 1200px; margin: 0 auto; width: 100%; padding: 0 40px 100px; position: relative; z-index: 10; }
  .category-section { margin-bottom: 120px; }

  .work-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 40px; }
  .work-card { display: block; text-decoration: none; position: relative; background: var(--card-bg); border-radius: 4px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.08); transition: 0.5s var(--ease-out-expo); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
  .work-card .border-shimmer { position: absolute; inset: 0; border-radius: 4px; padding: 1px; background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.5), transparent); background-size: 200% 100%; -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; animation: shimmerBorder 3s linear infinite; opacity: 0.6; z-index: 2; }

  .img-box { width: 100%; aspect-ratio: 16/9; overflow: hidden; position: relative; background: #000; }

  .play-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8); width: 60px; height: 60px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; opacity: 0; transition: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 2; }

  h3.work-title { font-family: var(--font-serif); font-size: 1.4rem; color: #fff; margin: 0; font-weight: 700; line-height: 1.4; transition: color 0.3s; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  @media (max-width: 768px) {

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    // --- 腳本邏輯 ---
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
    document.onkeydown = function(e) { if(e.keyCode == 123) return false; }

    const fallbackData = {
      title: "精選作品集",
      subtitle: "收錄歷年來的影像精華，每一部作品都是我們對美學的堅持。",
      portfolio_brand: [
        { title: "品牌形象廣告範例 A", client: "Client A", link: "#", image: "https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" }
      ]
    };

    function getYouTubeThumb(url) {
      if (!url) return 'https://dummyimage.com/600x338/111/fff&text=No+Video';
      const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=|shorts\/)([^#&?]*).*/);
      return (match && match[2].length === 11) ? `https://img.youtube.com/vi/${match[2]}/maxresdefault.jpg` : 'https://dummyimage.com/600x338/111/fff&text=Invalid+Link';
    }

    document.addEventListener('DOMContentLoaded', () => {
      // 1. 初始化 AOS
      if (window.AOS && typeof AOS.init === 'function') AOS.init({ duration: 1000, easing: 'ease-out-cubic', once: false, mirror: true, offset: 50 });

      loadPageData('works', 'content/works.md')
        .then(data => {
            renderWorks(data || fallbackData);
            setTimeout(removeLoader, 1400);
        })
        .catch(err => {
            console.log("Using fallback works data");
            renderWorks(fallbackData);
            setTimeout(removeLoader, 1400);
        });

      initCursor(); initPageTransition(); createParticles(); initMenu();
    });

    async function loadPageData(pageName, markdownPath) {
      const firebaseData = await loadFirestorePage(pageName);
      if (firebaseData) return firebaseData;
      const response = await fetch(markdownPath);
      if (!response.ok) throw new Error('CMS Data Not Found');
      const text = await response.text();
      const parts = text.split('---');
      return jsyaml.load(parts.length > 1 ? parts[1] : text);
    }

    async function loadFirestorePage(pageName) {
      try {
        if (window.loadFirebasePage) return await window.loadFirebasePage(pageName);
        const module = await import('./admin/firebase-frontend-loader.js?v=sync-20260613ux5');
        return await module.loadFirebasePage(pageName);
      } catch (error) {
        console.warn(`[Firebase] ${pageName} fallback to markdown`, error);
        return loadFirestorePageViaRest(pageName);
      }
    }

    async function loadFirestorePageViaRest(pageName) {
      try {
        const projectId = 'uprise-videoproduction-admin';
        const apiKey = 'AIzaSyCyC9CaF36J27mjCl908TFCukNtwAilM4o';
        const url = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/pages/${pageName}?key=${apiKey}`;
        const response = await fetch(url);
        if (!response.ok) return null;
        const doc = await response.json();
        return firestoreFieldsToObject(doc.fields || {});
      } catch (error) {
        console.warn(`[Firebase REST] ${pageName} fallback to markdown`, error);
        return null;
      }
    }

    function firestoreFieldsToObject(fields) {
      const out = {};
      Object.entries(fields || {}).forEach(([key, value]) => out[key] = firestoreValueToJs(value));
      return out;
    }

    function firestoreValueToJs(value) {
      if ('stringValue' in value) return value.stringValue;
      if ('integerValue' in value) return Number(value.integerValue);
      if ('doubleValue' in value) return Number(value.doubleValue);
      if ('booleanValue' in value) return value.booleanValue;
      if ('arrayValue' in value) return (value.arrayValue.values || []).map(firestoreValueToJs);
      if ('mapValue' in value) return firestoreFieldsToObject(value.mapValue.fields || {});
      if ('nullValue' in value) return null;
      return null;
    }

    // 🔴 漢堡選單邏輯 (已新增：點擊空白處關閉)
    function initMenu() {
        const hamburger = document.getElementById('hamburger-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        
        if (hamburger && mobileMenu) {
            // 1. 點擊漢堡按鈕開關
            hamburger.addEventListener('click', () => {
                hamburger.classList.toggle('active');
                mobileMenu.classList.toggle('active');
            });
            
            // 2. 點擊連結後關閉
            document.querySelectorAll('.mobile-nav-link').forEach(link => {
                link.addEventListener('click', () => {
                    hamburger.classList.remove('active');
                    mobileMenu.classList.remove('active');
                });
            });

            // 3. [新增] 點擊空白處 (黑色背景) 也可以關閉選單
            mobileMenu.addEventListener('click', (e) => {
                // 如果點擊的目標是 mobile-menu 本身或 mobile-nav (文字間隙)，而不是文字連結
                if (e.target === mobileMenu || e.target.classList.contains('mobile-nav')) {
                    hamburger.classList.remove('active');
                    mobileMenu.classList.remove('active');
                }
            });
        }
    }

    function removeLoader() {
        document.querySelector('.loader').classList.add('hidden');
        document.body.classList.remove('loading-state');
        document.body.classList.add('loaded-state');
    }

    function renderWorks(data) {
        if(data.title) document.getElementById('page-title').innerText = data.title;
        if(data.subtitle) document.getElementById('page-subtitle').innerText = data.subtitle;
        
        const wrapper = document.getElementById('works-wrapper');
        wrapper.innerHTML = '';

        const legacyCategories = [
            { id: 'portfolio_brand', name: '品牌形象廣告' },
            { id: 'portfolio_product', name: '產品形象廣告' },
            { id: 'portfolio_public', name: '公部門宣傳影片' },
            { id: 'portfolio_event', name: '活動紀錄' },
            { id: 'portfolio_other', name: '其他' }
        ];
        const categories = Array.isArray(data.portfolio_categories)
            ? data.portfolio_categories.map((category) => ({
                name: category.name || '未命名分類',
                items: Array.isArray(category.items) ? category.items : []
            }))
            : legacyCategories.map((category) => ({
                name: category.name,
                items: Array.isArray(data[category.id]) ? data[category.id] : []
            }));

        let hasContent = false;
        categories.forEach((cat) => {
            const items = cat.items;
            if (items && items.length > 0) {
                hasContent = true;
                let gridHtml = '';
                items.forEach((work, idx) => {
                    const thumbUrl = work.image ? work.image : getYouTubeThumb(work.link);
                    const clientName = work.client || ''; 
                    gridHtml += `
                        <a href="${work.link}" target="_blank" class="work-card hover-trigger" data-aos="fade-up" data-aos-delay="${idx * 100}">
                            <div class="border-shimmer"></div>
                            <div class="img-box"><img src="${thumbUrl}" alt="${work.title}" loading="lazy"><div class="play-icon"><i class="fas fa-play" style="color:#fff; margin-left:3px;"></i></div></div>
                            <div class="content"><span class="client">${clientName}</span><h3 class="work-title">${work.title}</h3></div>
                        </a>`;
                });
                const sectionHtml = `<div class="category-section" data-aos="fade-up" data-aos-delay="50"><div class="category-title" data-aos="fade-right">${cat.name}</div><div class="work-grid">${gridHtml}</div></div>`;
                wrapper.insertAdjacentHTML('beforeend', sectionHtml);
            }
        });
        if (!hasContent) wrapper.innerHTML = '<p style="text-align:center; padding:50px; color:#aaa;">目前尚無作品，請至後台新增。</p>';
        setTimeout(() => AOS.refresh(), 100);
    }
    
    function renderWorks(data) {
        if(data.title) document.getElementById('page-title').innerText = data.title;
        if(data.subtitle) document.getElementById('page-subtitle').innerText = data.subtitle;

        const wrapper = document.getElementById('works-wrapper');
        wrapper.innerHTML = '';

        const legacyCategories = [
            { id: 'portfolio_brand', name: '品牌形象廣告' },
            { id: 'portfolio_product', name: '產品形象廣告' },
            { id: 'portfolio_public', name: '公部門宣傳影片' },
            { id: 'portfolio_event', name: '活動紀錄' },
            { id: 'portfolio_other', name: '其他' }
        ];
        const categories = Array.isArray(data.portfolio_categories)
            ? data.portfolio_categories.map((category, index) => ({
                id: category.id || `category-${index}`,
                name: category.name || '未命名分類',
                items: Array.isArray(category.items) ? category.items : []
            }))
            : legacyCategories.map((category) => ({
                id: category.id,
                name: category.name,
                items: Array.isArray(data[category.id]) ? data[category.id] : []
            }));

        const visibleCategories = categories
            .map((cat, index) => ({
                ...cat,
                slug: makeCategorySlug(cat.id || cat.name || `category-${index}`)
            }))
            .filter(cat => cat.items && cat.items.length > 0);

        if (!visibleCategories.length) {
            wrapper.innerHTML = '<div class="works-empty">目前尚無作品，請至後台新增。</div>';
            return;
        }

        wrapper.insertAdjacentHTML('beforeend', `
          <div class="works-filterbar" aria-label="作品分類篩選">
            <span class="works-filter-label">FILTER</span>
            <button type="button" class="works-filter-btn is-active hover-trigger" data-category="all">ALL</button>
            ${visibleCategories.map(cat => `<button type="button" class="works-filter-btn hover-trigger" data-category="${escapeAttr(cat.slug)}">${escapeHtml(cat.name)}</button>`).join('')}
          </div>
        `);

        visibleCategories.forEach((cat, categoryIndex) => {
            const gridHtml = cat.items.map((work, idx) => {
                const thumbUrl = work.image ? work.image : getYouTubeThumb(work.link);
                const clientName = work.client || cat.name || '';
                const workTitle = work.title || 'Untitled Work';
                const link = work.link || '#';
                const isFeatured = idx === 0 ? ' is-featured' : '';
                const delay = Math.min(idx * 80, 320);
                return `
                    <a href="${escapeAttr(link)}" target="_blank" rel="noopener noreferrer" class="work-card${isFeatured} hover-trigger" data-category="${escapeAttr(cat.slug)}" data-work-index="${String(idx + 1).padStart(2, '0')}" data-aos="fade-up" data-aos-delay="${delay}">
                        <div class="border-shimmer"></div>
                        <div class="img-box">
                          <img src="${escapeAttr(thumbUrl)}" alt="${escapeAttr(workTitle)}" loading="lazy" onerror="this.src='https://dummyimage.com/960x540/111/fff&text=UPRISE';">
                          <div class="play-icon"><i class="fas fa-play" style="color:#fff; margin-left:3px;"></i></div>
                        </div>
                        <div class="content">
                          <span class="client">${escapeHtml(clientName)}</span>
                          <h3 class="work-title">${escapeHtml(workTitle)}</h3>
                        </div>
                    </a>`;
            }).join('');
            wrapper.insertAdjacentHTML('beforeend', `
              <section class="category-section" data-category="${escapeAttr(cat.slug)}" style="--section-index:${categoryIndex + 1}" data-aos="fade-up" data-aos-delay="50">
                <div class="category-title" data-aos="fade-right">${escapeHtml(cat.name)}</div>
                <div class="work-grid">${gridHtml}</div>
              </section>
            `);
        });

        initWorksExperience();
        setTimeout(() => {
          if (window.AOS && typeof AOS.refresh === 'function') AOS.refresh();
          initWorksExperience();
        }, 100);
    }

    function makeCategorySlug(value) {
      return String(value || 'category')
        .trim()
        .toLowerCase()
        .replace(/[^\w\u4e00-\u9fa5-]+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '') || 'category';
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }

    function initWorksExperience() {
      const wrapper = document.getElementById('works-wrapper');
      if (!wrapper) return;

      const buttons = wrapper.querySelectorAll('.works-filter-btn');
      const sections = wrapper.querySelectorAll('.category-section');
      buttons.forEach(button => {
        button.onclick = () => {
          const selected = button.dataset.category;
          buttons.forEach(item => item.classList.toggle('is-active', item === button));
          sections.forEach(section => {
            const shouldShow = selected === 'all' || section.dataset.category === selected;
            section.classList.toggle('is-hidden', !shouldShow);
          });
          setTimeout(() => {
            if (window.AOS && typeof AOS.refresh === 'function') AOS.refresh();
          }, 220);
        };
      });

      const finePointer = window.matchMedia('(pointer: fine)').matches;
      wrapper.querySelectorAll('.work-card').forEach(card => {
        if (card.dataset.interactiveReady === '1') return;
        card.dataset.interactiveReady = '1';

        if (!finePointer) {
          card.addEventListener('touchstart', () => card.classList.add('is-touched'), { passive: true });
          card.addEventListener('touchend', () => card.classList.remove('is-touched'), { passive: true });
          return;
        }

        card.addEventListener('mousemove', event => {
          const rect = card.getBoundingClientRect();
          const x = (event.clientX - rect.left) / rect.width;
          const y = (event.clientY - rect.top) / rect.height;
          card.style.setProperty('--tilt-x', `${(x - .5) * 7}deg`);
          card.style.setProperty('--tilt-y', `${(y - .5) * -6}deg`);
          card.style.setProperty('--card-glow-x', `${x * 100}%`);
          card.style.setProperty('--card-glow-y', `${y * 100}%`);
        });

        card.addEventListener('mouseleave', () => {
          card.style.setProperty('--tilt-x', '0deg');
          card.style.setProperty('--tilt-y', '0deg');
          card.style.setProperty('--card-glow-x', '50%');
          card.style.setProperty('--card-glow-y', '50%');
        });
      });

    }

    function initCursor() { if (window.matchMedia("(pointer: fine)").matches) { const cursor = document.querySelector('.cursor'); let mouseX=0, mouseY=0, cursorX=0, cursorY=0; document.addEventListener('mousemove', e => { mouseX=e.clientX; mouseY=e.clientY; }); document.addEventListener('mousedown', () => document.body.classList.add('clicking')); document.addEventListener('mouseup', () => document.body.classList.remove('clicking')); function animate() { cursorX+=(mouseX-cursorX)*0.5; cursorY+=(mouseY-cursorY)*0.5; cursor.style.transform=`translate(${cursorX}px, ${cursorY}px) translate(-50%, -50%)`; requestAnimationFrame(animate); } animate(); document.body.addEventListener('mouseenter', e=>{ if(e.target.closest('.hover-trigger')) document.body.classList.add('hovered'); }, true); document.body.addEventListener('mouseleave', e=>{ if(e.target.closest('.hover-trigger')) document.body.classList.remove('hovered'); }, true); } }
    function createParticles() { const container = document.getElementById('particles'); if(!container) return; for (let i = 0; i < 20; i++) { const p = document.createElement('div'); p.classList.add('particle'); const size = Math.random() * 3 + 1 + 'px'; p.style.width = size; p.style.height = size; p.style.left = Math.random() * 100 + '%'; p.style.top = Math.random() * 100 + '%'; p.style.animationDelay = Math.random() * 5 + 's'; p.style.animationDuration = Math.random() * 10 + 10 + 's'; container.appendChild(p); } }
    function initPageTransition() { document.querySelectorAll('.page-link').forEach(link => { link.addEventListener('click', (e) => { e.preventDefault(); document.body.classList.add('exiting'); setTimeout(() => { window.location.href = link.getAttribute('href'); }, 350); }); }); }
    window.addEventListener('scroll', () => {
        const header = document.querySelector('.header');
        if(window.scrollY > 50) header.classList.add('scrolled'); else header.classList.remove('scrolled');
        const footerMark = document.getElementById('footer-mark');
        if(footerMark) { const footerOffset = document.querySelector('footer').offsetTop; if(window.scrollY > footerOffset - window.innerHeight) { const delta = window.scrollY - (footerOffset - window.innerHeight); footerMark.style.transform = `translate(-50%, -50%) translateY(${delta * -0.1}px)`; } }
    });
  </script>
